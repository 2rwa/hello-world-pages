name: WebGPU eye clock browser test

on:
  push:
    branches: [main]
    paths:
      - 'tests/webgpu-eye-clock/index.html'
      - '.github/workflows/webgpu-eye-clock-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Static preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/webgpu-eye-clock/index.html")
          s = p.read_text()
          assert "navigator.gpu" in s
          assert "createRenderPipeline" in s
          assert "getCompilationInfo" in s
          assert "queue.onSubmittedWorkDone" in s
          assert "fwidth(" in s
          assert s.index("fwidth(") < s.index("discard;")
          assert "var<workgroup>" not in s
          assert "var<storage" not in s
          print("static preflight: ok")
          PY

      - name: Start local server
        run: |
          python3 -m http.server 8765 --directory . >/tmp/webgpu-http.log 2>&1 &
          echo $! > /tmp/webgpu-http.pid
          sleep 1
          curl -f http://127.0.0.1:8765/tests/webgpu-eye-clock/ >/dev/null

      - name: WebGPU browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium found on runner"
            exit 1
          fi

          echo "Browser: $CHROME"
          echo "Chrome version: $("$CHROME" --version || true)"

          chrome_args=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --enable-unsafe-webgpu
            --enable-features=Vulkan
            --use-vulkan=swiftshader
            --disable-vulkan-fallback-to-gl-for-testing
            --use-webgpu-adapter=swiftshader
            --enable-webgpu-developer-features
            --enable-dawn-features=allow_unsafe_apis
            --disable-dawn-features=use_dxc
            --use-gpu-in-tests
            --enable-unsafe-swiftshader
            --remote-debugging-port=9222
            --remote-allow-origins=*
            http://127.0.0.1:8765/tests/webgpu-eye-clock/
          )

          printf 'Chrome args:'
          printf ' %q' "${chrome_args[@]}"
          printf '\n'

          "$CHROME" "${chrome_args[@]}" >/tmp/chrome-stdout.log 2>/tmp/chrome.log &
          chrome_pid=$!
          trap 'kill $chrome_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/cdp-targets.json; then
              break
            fi
            sleep 1
          done

          python3 -m pip install --quiet websocket-client

          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import websocket

          def get_targets():
              with urllib.request.urlopen("http://127.0.0.1:9222/json/list", timeout=2) as r:
                  return json.load(r)

          targets = get_targets()
          page = next(
              (t for t in targets if t.get("type") == "page" and "webgpu-eye-clock" in t.get("url", "")),
              None,
          )
          if page is None:
              raise SystemExit("No WebGPU test page target found")

          ws = websocket.create_connection(page["webSocketDebuggerUrl"], timeout=5)
          next_id = 1

          def evaluate(expression):
              global next_id
              msg_id = next_id
              next_id += 1
              ws.send(json.dumps({
                  "id": msg_id,
                  "method": "Runtime.evaluate",
                  "params": {
                      "expression": expression,
                      "returnByValue": True,
                  },
              }))
              while True:
                  response = json.loads(ws.recv())
                  if response.get("id") == msg_id:
                      return response["result"]["result"].get("value")

          last_state = None
          deadline = time.time() + 25
          while time.time() < deadline:
              state = evaluate("""JSON.stringify({
                status: document.documentElement.dataset.webgpuStatus || null,
                stage: document.documentElement.dataset.webgpuStage || null,
                error: document.documentElement.dataset.webgpuError || null,
                text: document.querySelector('#state')?.textContent || null
              })""")
              if state != last_state:
                  print("WebGPU page state:", state, flush=True)
                  last_state = state
              parsed = json.loads(state)
              if parsed.get("status") == "ok":
                  print("WebGPU smoke test: ok")
                  ws.close()
                  raise SystemExit(0)
              if parsed.get("status") == "fail":
                  ws.close()
                  raise SystemExit("WebGPU page reported fail: " + str(parsed))
              time.sleep(0.5)

          ws.close()
          raise SystemExit("Timed out waiting for WebGPU page: " + str(last_state))
          PY

          echo "--- chrome stderr ---"
          cat /tmp/chrome.log || true
