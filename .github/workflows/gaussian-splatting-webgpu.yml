name: Gaussian Splatting WebGPU smoke
on:
  push:
    paths:
      - gaussian-splatting-demo/**
      - .github/workflows/gaussian-splatting-webgpu.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.0
      - run: node gaussian-splatting-demo/ci-test.mjs
      - name: Upload rendered Gaussian images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-splatting-snapshots
          path: gaussian-splatting-demo/test-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
