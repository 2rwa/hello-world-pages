name: Zundamon VOICEVOX Actions Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voicevox-zundamon-test.yml"
      - "voicevox-zundamon-test/source-text.txt"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: voicevox-zundamon-test
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebase before generating results
        run: git pull --rebase origin main

      - name: Pull VOICEVOX Engine
        run: docker pull voicevox/voicevox_engine:cpu-latest

      - name: Start VOICEVOX Engine
        run: |
          docker run --rm -d \
            --name voicevox-zundamon \
            -p 127.0.0.1:50021:50021 \
            voicevox/voicevox_engine:cpu-latest

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version; then
              echo
              exit 0
            fi
            sleep 2
          done

          docker logs voicevox-zundamon
          exit 1

      - name: Detect Zundamon normal style
        id: speaker
        run: |
          curl -fsS http://127.0.0.1:50021/speakers > /tmp/speakers.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          speakers = json.load(open("/tmp/speakers.json", encoding="utf-8"))
          z = next(s for s in speakers if s["name"] == "ずんだもん")
          style = next((st for st in z["styles"] if st["name"] == "ノーマル"), z["styles"][0])
          print(f"id={style['id']}")
          print(f"style={style['name']}")
          PY

      - name: Generate audio query
        run: |
          mkdir -p voicevox-zundamon-test
          curl -fsS -X POST \
            "http://127.0.0.1:50021/audio_query?speaker=${{ steps.speaker.outputs.id }}" \
            --get --data-urlencode text@voicevox-zundamon-test/source-text.txt \
            > voicevox-zundamon-test/query.json

      - name: Synthesize WAV
        run: |
          curl -fsS \
            -H "Content-Type: application/json" \
            -X POST \
            -d @voicevox-zundamon-test/query.json \
            "http://127.0.0.1:50021/synthesis?speaker=${{ steps.speaker.outputs.id }}" \
            > voicevox-zundamon-test/zundamon.wav

      - name: Validate real WAV output
        run: |
          SPEAKER_ID="${{ steps.speaker.outputs.id }}" \
          STYLE_NAME="${{ steps.speaker.outputs.style }}" \
          python3 - <<'PY'
          import json, os, wave
          from pathlib import Path

          wav_path = Path("voicevox-zundamon-test/zundamon.wav")
          assert wav_path.stat().st_size > 1000, f"WAV too small: {wav_path.stat().st_size} bytes"

          with wave.open(str(wav_path), "rb") as w:
              info = {
                  "speaker": "ずんだもん",
                  "style": os.environ["STYLE_NAME"],
                  "speaker_id": int(os.environ["SPEAKER_ID"]),
                  "channels": w.getnchannels(),
                  "sample_width_bytes": w.getsampwidth(),
                  "sample_rate_hz": w.getframerate(),
                  "frames": w.getnframes(),
              }
              info["duration_seconds"] = round(info["frames"] / info["sample_rate_hz"], 3)

          assert info["duration_seconds"] > 0.5, info
          assert info["channels"] in (1, 2), info
          assert info["sample_width_bytes"] >= 2, info

          Path("voicevox-zundamon-test/metadata.json").write_text(
              json.dumps(info, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(info, ensure_ascii=False, indent=2))
          PY

      - name: Upload synthesis artifact
        uses: actions/upload-artifact@v4
        with:
          name: zundamon-voicevox-sample
          path: |
            voicevox-zundamon-test/zundamon.wav
            voicevox-zundamon-test/query.json
            voicevox-zundamon-test/metadata.json

      - name: Commit generated sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            voicevox-zundamon-test/zundamon.wav \
            voicevox-zundamon-test/query.json \
            voicevox-zundamon-test/metadata.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "test: generate Zundamon VOICEVOX sample"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Engine log on failure
        if: failure()
        run: docker logs voicevox-zundamon || true
