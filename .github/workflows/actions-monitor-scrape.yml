name: Actions Monitor HTML Scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/actions-monitor-scrape-trigger"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actions-monitor-html-scrape
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main before generating result
        run: git pull --rebase origin main

      - name: Scrape public Actions pages
        run: python3 scripts/actions-monitor-scrape/collect.py

      - name: Commit changed status JSON only
        shell: bash
        run: |
          set -euo pipefail
          FILE="tests/actions-monitor-scrape/actions-status.json"
          if git diff --quiet -- "$FILE"; then
            echo "No status change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FILE"
            git commit -m "Update scraped Actions status"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
