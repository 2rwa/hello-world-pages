name: Stellar Flock Regression
on:
  push:
    branches: [main]
    paths: ['stellar-flock/**', '.github/workflows/stellar-flock-regression.yml', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Regression for parallel Pages deploys (RED until fixed)
        run: python3 stellar-flock/tests/regression.py --mode guard
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test user-visible browser gameplay
        run: python stellar-flock/tests/regression.py --mode local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stellar-local-${{ github.run_id }}
          path: stellar-flock/test-artifacts/
          if-no-files-found: ignore
  deployed:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Fail if Pages deployment failed
        env:
          RESULT: ${{ github.event.workflow_run.conclusion }}
        run: test "$RESULT" = success
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify deployed bytes and browser gameplay
        run: python stellar-flock/tests/regression.py --mode deployed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stellar-deployed-${{ github.run_id }}
          path: stellar-flock/test-artifacts/
          if-no-files-found: ignore
