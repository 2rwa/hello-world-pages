name: Sphere Shake WebGPU and Overlap Regression
on:
  push:
    branches: [main]
    paths:
      - "webgpu-shake-sphere/**"
      - ".github/workflows/shake-sphere-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  webgpu-overlaps:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: JavaScript syntax checks
        run: |
          for file in webgpu-shake-sphere/*.js webgpu-shake-sphere/*.mjs; do node --check "$file"; done
      - name: Install headless Chromium controller
        run: npm install --no-save puppeteer-core@24
      - name: Local Pages server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/sphere-shake-server.log 2>&1 &
          sleep 2
      - name: Test GPU pixels, 3D overlaps, acceleration and controls
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          WEBGPU_FLAGS: "--no-sandbox --enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --disable-vulkan-fallback-to-gl-for-testing --use-webgpu-adapter=swiftshader --enable-webgpu-developer-features --enable-dawn-features=allow_unsafe_apis --disable-dawn-features=use_dxc --use-gpu-in-tests --enable-unsafe-swiftshader"
        run: node webgpu-shake-sphere/ci-test.mjs
      - name: Display HTTP errors
        if: failure()
        run: cat /tmp/sphere-shake-server.log

      - name: Report GPU regression result to commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then state=success; else state=failure; fi
          curl --fail --silent --show-error --retry 3 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"state\":\"$state\",\"context\":\"sphere-shake/webgpu\",\"description\":\"WebGPU GPU pixels, sensors and mobile touch UI\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA"
