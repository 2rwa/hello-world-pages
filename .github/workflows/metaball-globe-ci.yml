name: Metaball Globe WebGPU CI
on:
  push:
    paths:
      - 'metaball-globe/**'
      - '.github/workflows/metaball-globe-ci.yml'
  workflow_dispatch:
jobs:
  webgpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Launch static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/metaball-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/metaball-globe/ -o /dev/null
      - name: Verify WebGPU shader, pixels, and collision physics
        run: node metaball-globe/tests/webgpu-smoke.cjs
