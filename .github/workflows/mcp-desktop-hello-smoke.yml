name: MCP Desktop Hello smoke
on:
  push:
    branches: [main]
    paths:
      - 'mcp-desktop-hello/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/mcp-desktop-hello-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test MCP protocol
        run: node --test mcp-desktop-hello/test/smoke.test.mjs
