name: MusicGen Japanese prompt and vocal test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/musicgen-japanese-test.yml"
      - "tests/musicgen-japanese/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: musicgen-japanese-test
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebase before generating
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.45,<5" sentencepiece scipy

      - name: Generate Japanese tests
        run: |
          rm -rf musicgen-japanese-test
          python tests/musicgen-japanese/generate.py --output-dir musicgen-japanese-test

      - name: Upload test files
        uses: actions/upload-artifact@v4
        with:
          name: musicgen-japanese-test
          path: musicgen-japanese-test/
          if-no-files-found: error

      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Commit generated results
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musicgen-japanese-test
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "test: MusicGen Japanese prompt and vocal samples"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
