name: SDF crack WebGPU smoke test

on:
  push:
    branches: [main]
    paths:
      - 'tests/sdf-crack/index.html'
      - '.github/workflows/sdf-crack-webgpu-test.yml'
  workflow_dispatch:

concurrency:
  group: sdf-crack-webgpu-test
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  webgpu-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Static preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("tests/sdf-crack/index.html").read_text()
          assert "navigator.gpu" in s
          assert "getCompilationInfo" in s
          assert "queue.onSubmittedWorkDone" in s
          assert "copyTextureToBuffer" in s
          for slider_id in ["openingSlider","lengthSlider","dangerSlider","branchSlider"]:
              assert f'id="{slider_id}"' in s, slider_id
          assert 'id="modeSelect"' in s
          assert "pointerdown" in s and "pointermove" in s and "wheel" in s
          assert "data-render-revision" in s
          print("static preflight: ok")
          PY

      - name: Start server and Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sdf-http.log 2>&1 &
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --user-data-dir=/tmp/sdf-crack-chrome \
            --enable-unsafe-webgpu \
            --enable-features=Vulkan \
            --use-vulkan=swiftshader \
            --disable-vulkan-fallback-to-gl-for-testing \
            --use-webgpu-adapter=swiftshader \
            --enable-webgpu-developer-features \
            --enable-dawn-features=allow_unsafe_apis \
            --disable-dawn-features=use_dxc \
            --use-gpu-in-tests \
            --enable-unsafe-swiftshader \
            'http://127.0.0.1:8765/tests/sdf-crack/?ci=1' >/tmp/sdf-chrome.log 2>&1 &
          echo $! >/tmp/sdf-chrome.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat /tmp/sdf-chrome.pid)" 2>/dev/null; then
              cat /tmp/sdf-chrome.log
              exit 1
            fi
            sleep 0.25
          done
          cat /tmp/sdf-chrome.log
          exit 1

      - name: Poll page result
        id: webgpu
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          python3 - <<'PY'
          import json,time,urllib.request,websocket,pathlib
          deadline=time.time()+25
          page=None
          state={"status":"","stage":"startup","error":"","visiblePixelCount":""}
          state_path=pathlib.Path("/tmp/sdf-state.json")
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2))
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:9222/json/list",timeout=2) as r:
                      pages=json.load(r)
                  page=next((p for p in pages if p.get("type")=="page" and "/tests/sdf-crack/" in p.get("url","")),None)
                  if page: break
              except Exception: pass
              time.sleep(.2)
          if not page:
              state["error"]="test page target not found"
              state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2))
              raise SystemExit(state["error"])
          ws=websocket.create_connection(page["webSocketDebuggerUrl"],timeout=5)
          msg_id=0
          def evaluate(expr):
              global msg_id
              msg_id+=1
              current=msg_id
              ws.send(json.dumps({"id":current,"method":"Runtime.evaluate","params":{"expression":expr,"returnByValue":True}}))
              while True:
                  response=json.loads(ws.recv())
                  if response.get("id")==current:
                      return response["result"]["result"].get("value")
          last=None
          while time.time()<deadline:
              raw=evaluate("""JSON.stringify({
                status:document.documentElement.dataset.webgpuStatus||"",
                stage:document.documentElement.dataset.webgpuStage||"",
                error:document.documentElement.dataset.webgpuError||"",
                visiblePixelCount:document.documentElement.dataset.visiblePixelCount||""
              })""")
              state=json.loads(raw)
              state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2))
              if raw!=last:
                  print("state:",raw,flush=True)
                  last=raw
              if state["status"]=="ok":
                  ui_raw=evaluate("""JSON.stringify({
                    sliders:["openingSlider","lengthSlider","dangerSlider","branchSlider"].map(id=>Boolean(document.getElementById(id))),
                    revision:Number(document.documentElement.dataset.renderRevision||"0"),
                    openingValue:document.getElementById("openingValue")?.value||""
                  })""")
                  ui_state=json.loads(ui_raw)
                  if not all(ui_state["sliders"]):
                      ws.close()
                      raise SystemExit("slider UI missing: "+ui_raw)
                  before_revision=ui_state["revision"]
                  evaluate("""(() => {
                    const slider=document.getElementById("openingSlider");
                    slider.value="0.100";
                    slider.dispatchEvent(new Event("input",{bubbles:true}));
                    return true;
                  })()""")
                  time.sleep(.7)
                  after_raw=evaluate("""JSON.stringify({
                    revision:Number(document.documentElement.dataset.renderRevision||"0"),
                    openingValue:document.getElementById("openingValue")?.value||"",
                    parameter:JSON.parse(document.documentElement.dataset.currentParameters||"{}").opening
                  })""")
                  after=json.loads(after_raw)
                  if after["revision"] <= before_revision:
                      ws.close()
                      raise SystemExit("slider input did not trigger render: "+after_raw)
                  if after["openingValue"] != "0.100" or abs(float(after["parameter"])-0.1)>1e-6:
                      ws.close()
                      raise SystemExit("slider value did not reach render parameters: "+after_raw)

                  mode_before=after["revision"]
                  evaluate("""(() => {
                    const selectElement=document.getElementById("modeSelect");
                    selectElement.value="2";
                    selectElement.dispatchEvent(new Event("change",{bubbles:true}));
                    return true;
                  })()""")
                  time.sleep(.7)
                  mode_raw=evaluate("""JSON.stringify({
                    revision:Number(document.documentElement.dataset.renderRevision||"0"),
                    mode:Number(JSON.parse(document.documentElement.dataset.currentParameters||"{}").mode),
                    label:document.getElementById("modeValue")?.value||""
                  })""")
                  mode_state=json.loads(mode_raw)
                  if mode_state["revision"] <= mode_before or mode_state["mode"] != 2 or mode_state["label"] != "Impact":
                      ws.close()
                      raise SystemExit("mode select did not reach render parameters: "+mode_raw)

                  camera_before=mode_state["revision"]
                  camera_raw_before=evaluate("document.documentElement.dataset.cameraState||'{}'")
                  evaluate("""(() => {
                    const canvas=document.getElementById("gpuCanvas");
                    canvas.dispatchEvent(new PointerEvent("pointerdown",{pointerId:17,clientX:100,clientY:80,bubbles:true}));
                    canvas.dispatchEvent(new PointerEvent("pointermove",{pointerId:17,clientX:145,clientY:102,bubbles:true}));
                    canvas.dispatchEvent(new PointerEvent("pointerup",{pointerId:17,clientX:145,clientY:102,bubbles:true}));
                    return true;
                  })()""")
                  time.sleep(.7)
                  camera_raw=evaluate("""JSON.stringify({
                    revision:Number(document.documentElement.dataset.renderRevision||"0"),
                    camera:JSON.parse(document.documentElement.dataset.cameraState||"{}")
                  })""")
                  camera_state=json.loads(camera_raw)
                  camera_before_state=json.loads(camera_raw_before)
                  if camera_state["revision"] <= camera_before:
                      ws.close()
                      raise SystemExit("pointer drag did not trigger render: "+camera_raw)
                  if abs(float(camera_state["camera"]["yaw"])-float(camera_before_state["yaw"])) < 0.05:
                      ws.close()
                      raise SystemExit("pointer drag did not change yaw: "+camera_raw)

                  state["uiTest"]={"slider":after,"mode":mode_state,"camera":camera_state}
                  state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2))
                  ws.close()
                  print("SDF crack WebGPU + controls + orbit smoke test: ok")
                  raise SystemExit(0)
              if state["status"]=="fail":
                  ws.close()
                  raise SystemExit("page failure: "+raw)
              time.sleep(.25)
          ws.close()
          state["error"]="timeout waiting for WebGPU result"
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2))
          raise SystemExit("timeout: "+str(last))
          PY


      - name: Capture rendered preview PNG
        if: ${{ steps.webgpu.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,urllib.request,websocket
          with urllib.request.urlopen("http://127.0.0.1:9222/json/list",timeout=2) as r:
              pages=json.load(r)
          page=next(p for p in pages if p.get("type")=="page" and "/tests/sdf-crack/" in p.get("url",""))
          ws=websocket.create_connection(page["webSocketDebuggerUrl"],timeout=5)
          ws.send(json.dumps({"id":1,"method":"Runtime.evaluate","params":{
              "expression":"document.getElementById('gpuCanvas').toDataURL('image/png')",
              "returnByValue":True
          }}))
          while True:
              message=json.loads(ws.recv())
              if message.get("id")==1:
                  data_url=message["result"]["result"].get("value","")
                  break
          ws.close()
          if not data_url.startswith("data:image/png;base64,"):
              raise SystemExit("PNG data URL unavailable")
          payload=data_url.split(",",1)[1]
          open("/tmp/sdf-crack-preview.png","wb").write(base64.b64decode(payload))
          print("saved /tmp/sdf-crack-preview.png")
          PY

      - name: Upload rendered preview
        if: ${{ steps.webgpu.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: sdf-crack-preview
          path: /tmp/sdf-crack-preview.png
          retention-days: 7

      - name: Save compact result to repository
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.webgpu.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "test_outcome=${TEST_OUTCOME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "state="
            cat /tmp/sdf-state.json 2>/dev/null || echo '{"error":"state file unavailable"}'
            echo
            echo "chrome_tail="
            tail -n 25 /tmp/sdf-chrome.log 2>/dev/null || true
          } > tests/sdf-crack/action-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add tests/sdf-crack/action-result.txt
          git commit -m "Record SDF crack WebGPU test result" || exit 0
          git push origin HEAD:main
