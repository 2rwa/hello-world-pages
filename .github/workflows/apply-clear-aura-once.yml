name: Apply clear crystal aura once
on:
  push:
    paths: ['tools/apply-clear-aura-once.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: python3 tools/apply-clear-aura-once.py
      - shell: bash
        run: |
          rm tools/apply-clear-aura-once.py .github/workflows/apply-clear-aura-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/crystal-dice-fanfare/index.html tools/apply-clear-aura-once.py .github/workflows/apply-clear-aura-once.yml
          git commit -m "Refine crystal dice with result-driven rainbow aura"
          git push origin HEAD:main
