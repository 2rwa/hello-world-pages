<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d19"><title>Smoke Marble Globe — Glass-shy two-phase smoke</title>
<link rel="stylesheet" href="./style.css?v=1"></head><body>
<canvas id="view" aria-label="ガラス球内を漂い相分離する煙球のWebGPUシミュレーション"></canvas>
<header class="identity"><p>WEBGPU / SOFT MATTER LAB</p><h1>SMOKE<br><span>MARBLES</span></h1><small>Fume · Oil / Water · Glass Repulsion</small></header>
<div id="stats" class="stats">INITIALIZING GPU</div>
<aside id="panel" class="panel" aria-label="煙球の詳細設定">
 <div class="panel-head"><div><strong>SMOKE MARBLE LAB</strong><small id="deviceLabel">⚙ CONTROLS · LIVE</small></div>
 <button id="closePanel" type="button" aria-label="パネルを閉じる">✕</button></div>
 <div class="toolbar">
  <div class="presets" id="presets"></div>
  <div class="search-line"><input type="search" id="paramSearch" autocomplete="off" placeholder="パラメータを検索…"><button id="clearSearch" title="検索をクリア">×</button></div>
  <small id="resultCount" aria-live="polite"></small>
 </div>
 <div id="controls" class="control-scroll"></div>
 <div class="file-actions">
  <button id="restore" type="button">初期値</button>
  <button id="export" type="button">JSON保存</button>
  <button id="import" type="button">JSON読込</button>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
 </div>
 <div id="notice" class="notice" role="status">変更内容はブラウザに自動保存されます。</div>
 <div class="actions">
  <button id="pause" type="button">Ⅱ PAUSE</button>
  <button id="stir" type="button">✺ STIR</button>
  <button id="reset" type="button">↻ RESET</button>
  <button id="cameraReset" type="button">◎ VIEW</button>
 </div>
</aside>
<button id="toggle" class="toggle" type="button" aria-controls="panel" aria-expanded="true">⚙ 詳細設定 <small id="controlCount"></small></button>
<div id="error" hidden role="alert"></div>
<script type="module" src="./main.js?v=1"></script>
</body></html>
