<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Gaussian Splatting · WebGPU Lab</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 55% 45%,#132038 0%,#070e1c 49%,#040711 100%);color:#edf4ff}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.panel{position:fixed;z-index:3;top:14px;left:14px;width:min(310px,calc(100vw - 28px));padding:16px;border:1px solid #ffffff23;border-radius:17px;background:#0c1425e8;backdrop-filter:blur(20px);box-shadow:0 12px 55px #0005}
.top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}.eyebrow{color:#80cfff;font-size:10px;letter-spacing:.16em;font-weight:700}h1{margin:5px 0 6px;font-size:19px;letter-spacing:-.025em}.sub{margin:0 0 14px;color:#96a9c2;font-size:11px;line-height:1.5}
button,select{font:inherit;color:inherit;border:1px solid #53627875;border-radius:9px;background:#19263b;padding:7px;cursor:pointer}button:hover,select:hover{background:#263c58}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #66ccff}
#collapse{font-size:12px;padding:5px 9px}.panel.hide .body{display:none}.panel.hide{width:auto}.panel.hide h1{font-size:14px}.panel.hide .eyebrow{display:none}
label{display:flex;justify-content:space-between;align-items:center;color:#d6e1f3;font-size:12px;margin:13px 0 7px}label output{color:#8bd8ff;font-variant-numeric:tabular-nums}
select{width:100%;font-size:12px}input[type=range]{display:block;width:100%;accent-color:#61bbff;cursor:pointer}.row{display:flex;gap:9px;margin-top:13px}.row button{flex:1;font-size:12px}.check{margin:12px 0;justify-content:flex-start;gap:8px}.check input{accent-color:#74cfff}
.metrics{display:flex;gap:8px;margin-top:13px}.metric{background:#ffffff0b;border:1px solid #ffffff0b;border-radius:8px;padding:8px;flex:1;min-width:0}.metric b{display:block;font-size:16px;font-variant-numeric:tabular-nums}.metric small{display:block;color:#91a5bf;font-size:9px;margin-top:2px}
.hint{color:#8396ad;font-size:10px;line-height:1.6;margin:12px 0 0}.note{position:fixed;bottom:15px;right:16px;color:#b9ccdd91;font-size:11px;text-align:right;pointer-events:none;max-width:60vw}
.error{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(510px,90vw);background:#271923;border:1px solid #ff8f8f8a;border-radius:14px;padding:22px;line-height:1.7;font-size:14px}.error[hidden]{display:none}
@media(max-width:580px){.panel{top:8px;left:8px;width:min(270px,calc(100vw - 16px));padding:11px}.note{bottom:8px;right:9px;font-size:9px}h1{font-size:16px}.sub{margin-bottom:8px}}
</style></head><body>
<canvas id="screen" aria-label="Gaussian Splatting WebGPU renderer"></canvas>
<aside class="panel" id="panel"><div class="top"><div><div class="eyebrow">REAL-TIME WEBGPU EXPERIMENT</div><h1>Gaussian Splatting</h1></div><button id="collapse" aria-label="メニューの開閉">−</button></div>
<div class="body"><p class="sub">3Dの楕円ガウス分布を画面に投影して合成。学習済み写真ではなく、手続き生成したデータです。</p>
<label for="scene">シーン</label><select id="scene"><option value="galaxy">銀河・星雲</option><option value="torus">発光トーラス</option><option value="flower">花弁</option><option value="shell">球殻</option></select>
<label for="count">Gaussian 数 <output id="countVal">4,000</output></label><select id="count"><option value="400">400</option><option value="1500">1,500</option><option value="4000" selected>4,000</option><option value="10000">10,000</option><option value="30000">30,000</option></select>
<label for="size">分布の広がり <output id="sizeVal">1.00×</output></label><input type="range" id="size" min="0.25" max="2.5" step="0.05" value="1">
<label for="opacity">不透明度 <output id="opacityVal">0.55×</output></label><input type="range" id="opacity" min="0.1" max="2" step="0.05" value="0.55">
<label class="check"><input type="checkbox" id="points">中心点表示（比較）</label>
<label class="check"><input type="checkbox" id="auto" checked>ゆっくり自動回転</label>
<div class="row"><button id="reset">視点を戻す</button><button id="regen">再生成</button></div>
<div class="metrics"><div class="metric"><b id="fps">—</b><small>FPS</small></div><div class="metric"><b id="visible">—</b><small>投影対象数</small></div><div class="metric"><b id="resolution">—</b><small>内部解像度</small></div></div>
<p class="hint">ドラッグ：視点回転　ホイール / ピンチ：拡大縮小<br>各Gaussianは独立した位置・回転・3軸スケール・色・Alphaを保持します。</p></div></aside>
<div id="error" class="error" hidden></div><div class="note">3D → 2D covariance projection · depth sorting · alpha compositing<br>WebGPU · WGSL · No frameworks</div>
<script type="module" src="./app.js"></script></body></html>
