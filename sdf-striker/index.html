<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101f"><title>SDF STRIKER | WebGPU procedural character</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,"Noto Sans JP",sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050b17;color:#e5f5ff}main{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}#viewport{position:relative;overflow:hidden;touch-action:none;background:#0a1125}#gpu-canvas{display:block;width:100%;height:100%}.tag{position:absolute;top:22px;left:24px;pointer-events:none}.tag small{display:block;color:#7ee6ec;letter-spacing:.3em;font-size:11px}.tag h1{margin:4px 0 0;font-size:23px;letter-spacing:.13em;font-weight:800}.tag p{font-size:12px;color:#bdd0dc}.footer{position:absolute;left:24px;bottom:18px;color:#a0bdcc;font-size:12px;pointer-events:none}aside{background:linear-gradient(155deg,#101b2d,#07101c);border-left:1px solid #253852;padding:22px;overflow:auto}.eyebrow{font-size:11px;letter-spacing:.2em;color:#72e2f3}h2{font-size:19px;margin:10px 0}p{font-size:13px;line-height:1.65;color:#9fb0c5}section{padding:16px 0;border-top:1px solid #24344b}label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#d2e8f1;margin-bottom:6px}output{color:#80edf3;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#66eff5;margin:0 0 14px;touch-action:pan-x}button{background:#172e43;border:1px solid #326077;border-radius:8px;padding:10px 12px;color:#dff9ff;cursor:pointer}button:active{background:#205470}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{margin-top:15px;border:1px solid #37556b;border-radius:8px;padding:10px;font-size:12px;line-height:1.5;color:#a6cfdb;overflow-wrap:anywhere}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px}.legend span{padding:5px 8px;border:1px solid #31556c;border-radius:4px;color:#b6d7e0}code{color:#69e5df}#error{color:#ffafaa;white-space:pre-wrap}@media(max-width:720px){main{display:flex;flex-direction:column}#viewport{flex:1 1 52vh;min-height:48vh}aside{flex:0 0 auto;max-height:43vh;border-left:0;border-top:1px solid #294057;padding:12px 18px}.tag{left:16px;top:12px}.tag h1{font-size:19px}.footer{left:16px;bottom:12px}.short{display:none}section{padding:10px 0}h2{margin:0 0 8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<div id="viewport"><canvas id="gpu-canvas" aria-label="WebGPU SDF floating robot model"></canvas><div class="tag"><small>PROCEDURAL / 100% SDF</small><h1>SDF STRIKER</h1><p>浮遊型シューティングキャラクター / Prototype 01</p></div><div class="footer">ドラッグ / スワイプで回転 ・ ホイールでズーム</div></div>
<aside><div class="eyebrow">WEBGPU RAYMARCH CHARACTER</div><h2>MODEL CONTROL</h2><p class="short">ポリゴン・外部モデルなし。WGSL内のSDFで胴体・コア・腕・武装を構成。</p>
<section><label for="turn">視点回転 <output id="turn-label"></output></label><input id="turn" type="range" min="-180" max="180" value="24" step="1"><label for="pitch">仰角 <output id="pitch-label"></output></label><input id="pitch" type="range" min="-60" max="60" value="13" step="1"><label for="zoom">カメラ距離 <output id="zoom-label"></output></label><input id="zoom" type="range" min="3.7" max="9" value="5.4" step="0.1"></section>
<section><label for="animate">アニメーション <output id="animate-label"></output></label><input id="animate" type="range" min="0" max="1" step="0.05" value="1"><label for="quality">描画解像度 <output id="quality-label"></output></label><input id="quality" type="range" min="0.35" max="1" value="0.7" step="0.05"><label for="steps">レイマーチ回数 <output id="steps-label"></output></label><input id="steps" type="range" min="44" max="116" step="4" value="80"><label for="glow">エネルギー発光 <output id="glow-label"></output></label><input id="glow" type="range" min="0" max="3" value="1.4" step="0.1"></section>
<section><div class="buttons"><button type="button" id="pause">停止</button><button type="button" id="reset">リセット</button></div><div class="status" role="status" aria-live="polite"><span id="status">起動中</span><div id="error"></div></div></section><section><p>モデル構成</p><div class="legend"><span>Sphere</span><span>Capsule</span><span>Round Box</span><span>Torus</span><span>CSG union</span></div><p>SDF sphere tracing・法線差分・多材質ライティング。中心コアのガラス調表現は疑似シェーディング（多重屈折ではありません）。</p></section></aside></main>
<script type="module" src="./app.js"></script></body></html>
