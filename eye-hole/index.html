<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EYE HOLE — WebGPU prototype</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div class="panel">
    <div class="title">EYE HOLE // PROTOTYPE 01</div>
    <div class="sub">CARVE THE WALLS. DO NOT LET THEM WATCH.</div>
    <div class="meterRow"><span>ALERT</span><div class="meter"><i id="alertFill"></i></div><b id="alertText">0%</b></div>
    <div class="meterRow"><span>DRILL</span><div class="meter"><i id="energyFill"></i></div><b id="energyText">8.0</b></div>
    <div class="stats" id="stats">initializing WebGPU…</div>
  </div>
  <div id="crosshair"></div>
  <div id="message">Click to capture mouse</div>
</div>
<div class="overlay" id="startOverlay">
  <div class="card">
    <h1>EYE HOLE</h1>
    <p>巨大な球状構造物の内部から脱出してください。壁は掘れます。目玉はあなたを見ていますが、こちらから見返している間は警戒を進めません。</p>
    <div class="keys"><b>W A S D</b><span>移動</span><b>Mouse</b><span>視点</span><b>Left click</b><span>壁を掘る</span><b>Right click</b><span>短時間スキャン</span><b>Shift</b><span>加速</span><b>Space / C</b><span>上昇 / 下降</span><b>R</b><span>最初から</span></div>
    <button id="startButton">ENTER STRUCTURE</button>
  </div>
</div>
<div class="overlay hidden" id="endOverlay"><div class="card"><h1 id="endTitle">ESCAPED</h1><p id="endText"></p><button id="restartButton">RESTART</button></div></div>
<div id="ciStatus" class="hidden">boot</div>
<script type="module" src="./game.js"></script>
</body>
</html>
