<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAT-04 | Percolation Megastructure</title><style>body{margin:0;background:#080d13;color:#eef;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;top:12px;left:12px;width:min(330px,94vw);background:#111925e8;padding:13px;}h1{margin:0}small{color:#aebbc5}label{display:block;margin-top:6px}input{width:100%;accent-color:#ffd338}button{background:#253343;color:white;border:1px solid #7b8998;padding:7px;margin:6px 4px 0 0}b{color:#ffd338}#error{color:#ff9a92;white-space:pre-wrap}</style><canvas id="view"></canvas><aside><h1>PERCOLATION</h1><label>p <b id="pval">0.18</b><input id="prob" type="range" min="0.12" max="0.54" step="0.002" value="0.18"></label><button id="sweep">Pause</button><button id="enter">Enter</button><button id="reset">Seed</button><p id="stats">Loading</p><small>Yellow = largest cluster. Walk: drag/WASD, Q/E, Shift.</small><p id="error"></p></aside><script>const cv=document.querySelector('#view'),ctx=cv.getContext('webgpu'),err=document.querySelector('#error'),slider=document.querySelector('#prob'),labelP=document.querySelector('#pval'),meter=document.querySelector('#stats');const N=12,S=1728,occ=new Uint32Array(64),giant=new Uint32Array(64),rv=new Float32Array(S);let seed=1731,p=.18,sw=true,walk=false,span=false,bestCells=[],eye=[22,19,25],yaw=0,pt=0,gpu,pipe,bind,uni,ob,gb,fmt,last=0,prevP=-1;const keys=new Set();function hash(n){n=Math.imul(n^seed,0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);return ((n^(n>>>16))>>>0)/4294967296}function idx(x,y,z){return x+N*(y+N*z)}function hasSite(i){return (occ[i>>>5]&(1<<(i&31)))!==0}function mark(a,i){a[i>>>5]|=1<<(i&31)}function build(){occ.fill(0);giant.fill(0);for(let i=0;i<S;i++)if(rv[i]<p)mark(occ,i);const seen=new Uint8Array(S),stk=new Int32Array(S);let win=[],maxGrp=[],cr=[];for(let i=0;i<S;i++){if(!hasSite(i)||seen[i])continue;let top=0,head=0,minX=12,maxX=-1;stk[top++]=i;seen[i]=1;const grp=[];while(head<top){const k=stk[head++],x=k%N,y=(k/N|0)%N,z=k/(N*N)|0;grp.push(k);minX=Math.min(minX,x);maxX=Math.max(maxX,x);const ns=[[x-1,y,z],[x+1,y,z],[x,y-1,z],[x,y+1,z],[x,y,z-1],[x,y,z+1]];for(const [a,b,c] of ns){if(a<0||b<0||c<0||a>=N||b>=N||c>=N)continue;const j=idx(a,b,c);if(hasSite(j)&&!seen[j]){seen[j]=1;stk[top++]=j}}}if(grp.length>maxGrp.length)maxGrp=grp;if(minX===0&&maxX===N-1&&grp.length>cr.length)cr=grp}win=maxGrp;bestCells=win;span=cr.length>0;for(const i of win)mark(giant,i);labelP.textContent=p.toFixed(3);meter.innerHTML='Giant: <b>'+win.length+'</b> / '+S+' sites<br>X-spanning: <b>'+(span?'YES':'NO')+'</b> · p<sub>c</sub>≈0.3116';if(gpu){gpu.queue.writeBuffer(ob,0,occ);gpu.queue.writeBuffer(gb,0,giant)}}function reseed(){seed=(seed+17389)|0;for(let i=0;i<S;i++)rv[i]=hash(i);build()}function vec(a,b){return a.map((v,i)=>v-b[i])}function norm(a){const l=Math.hypot(...a)||1;return a.map(v=>v/l)}function cr(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function enter(){if(walk){walk=false;eye=[22,19,25];return}let spot=null;for(const k of bestCells){const x=k%N,y=(k/N|0)%N,z=k/(N*N)|0;for(const [a,b,c] of [[x+1,y,z],[x-1,y,z],[x,y+1,z],[x,y-1,z],[x,y,z+1],[x,y,z-1]]){if(a>=0&&b>=0&&c>=0&&a<N&&b<N&&c<N&&!hasSite(idx(a,b,c))){spot=[[a+.5,b+.5,c+.5],[x+.5,y+.5,z+.5]];break}}if(spot)break}if(!spot){err.textContent='No empty neighbor. Lower p.';return}eye=spot[0];const d=norm(vec(spot[1],eye));yaw=Math.atan2(d[0],d[2]);pt=Math.asin(d[1]);walk=true;err.textContent=''}slider.oninput=()=>{p=+slider.value;sw=false;document.querySelector('#sweep').textContent='Resume sweep';build()};document.querySelector('#sweep').onclick=()=>{sw=!sw;document.querySelector('#sweep').textContent=sw?'Pause sweep':'Resume sweep'};document.querySelector('#enter').onclick=enter;document.querySelector('#reset').onclick=()=>{walk=false;eye=[22,19,25];reseed()};window.onkeydown=e=>{keys.add(e.code);if(['Spa =vec3i(12))){break;}let wall=select(vec3f(cell),vec3f(cell+vec3i(1)),rd>vec3f(0.0));let edgeT=(wall-ro)/safe;let te=min(min(edgeT.x,edgeT.y),edgeT.z);let k=u32(cell.x+12*cell.y+144*cell.z);if(isSite(k)){let aa=(vec3f(cell)+vec3f(0.065)-ro)/safe;let bb=(vec3f(cell)+vec3f(0.935)-ro)/safe;let aa0=min(aa,bb);let bb0=max(aa,bb);let hi=max(max(aa0.x,aa0.y),aa0.z);let ho=min(min(bb0.x,bb0.y),bb0.z);if(ho>=max(t,hi)&&hi<te){let hit=max(t,hi);let local=ro+rd*(hit+0.00001)-vec3f(cell)-vec3f(0.5);let ab=abs(local);var nrm=vec3f(0.0,0.0,sign(local.z));if(ab.x>=ab.y&&ab.x>=ab.z){nrm=vec3f(sign(local.x),0.0,0.0);}else if(ab.y>=ab.z){nrm=vec3f(0.0,sign(local.y),0.0);}let sun=normalize(vec3f(-0.55,0.82,0.5));let dif=max(dot(nrm,sun),0.0);let gold=isGiant(k);let mat=select(vec3f(0.81,0.87,0.9),vec3f(1.0,0.72,0.065),gold);let glow=pow(1.0-max(dot(nrm,-rd),0.0),3.0);let col=mat*(0.32+0.68*dif)+vec3f(0.15,0.18,0.22)*glow;let fog=1.0-exp(-0.0009*hit*hit);return vec4f(mix(col,bg,fog),1.0);}}t=max(te+0.0004,t+0.0004);if(t>tf){break;}}}return vec4f(bg,1.0);}`;function fail(e){err.textContent=String(e?.message||e);console.error(e)}async function init(){if(!navigator.gpu)throw Error('WebGPU unavailable');if(!ctx)throw Error('WebGPU cv context unavailable');const ad=await navigator.gpu.requestAdapter();if(!ad)throw Error('WebGPU ad unavailable');gpu=await ad.requestDevice();gpu.lost.then(info=>fail('Device lost: '+info.reason+' '+info.message));gpu.addEventListener('uncapturederror',e=>fail('GPU error: '+e.error.message));const module=gpu.createShaderModule({code:shader});const info=await module.getCompilationInfo();const errors=info.messages.filter(m=>m.type==='error');if(errors.length)throw Error(errors.map(m=>'WGSL L'+m.lineNum+': '+m.message).join('\n'));fmt=navigator.gpu.getPreferredCanvasFormat();pipe=await gpu.createRenderPipelineAsync({layout:'auto',vertex:{module,entryPoint:'vs'},fragment:{module,entryPoint:'fs',targets:[{format:fmt}]},primitive:{topology:'triangle-list'}});ob=gpu.cr
