<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111e"><title>Glass Metaball Globe | WebGPU</title>
<link rel="stylesheet" href="./style.css?v=1"></head><body>
<canvas id="view" aria-label="外殻の中で融合・分離する透明なガラスメタボール"></canvas>
<header class="hero"><small>WEBGPU / RAYMARCHED OPTICS</small><h1>GLASS<br><em>METABALLS</em></h1><p>Metamorphic crystal · inside a glass globe</p></header>
<div id="stats" class="stats">WEBGPU STARTING...</div>
<aside id="panel" class="panel" aria-label="ガラスメタボール詳細設定">
 <div class="panel-head"><div><strong>GLASS METABALL LAB</strong><small id="statusLabel">REAL-TIME RAYMARCHING</small></div><button id="closePanel" aria-label="設定を閉じる">✕</button></div>
 <div class="top-controls">
  <div class="presets" id="presets"></div>
  <div class="search"><input id="search" type="search" autocomplete="off" placeholder="設定を検索：屈折・融合・球数…"><button id="clearSearch" aria-label="検索をクリア">×</button></div>
  <small id="resultCount"></small>
 </div>
 <div class="scroll" id="controls"></div>
 <div class="persistence">
  <button id="defaults">初期値</button><button id="export">JSON保存</button><button id="import">JSON読込</button>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
 </div>
 <small id="notice" class="notice" role="status">設定はこのブラウザに自動保存されます</small>
 <div class="actions"><button id="pause">Ⅱ PAUSE</button><button id="stir">✺ STIR</button><button id="reset">↻ RESET</button><button id="resetCamera">◎ VIEW</button></div>
</aside>
<button id="toggle" class="toggle" aria-controls="panel" aria-expanded="true">⚙ 詳細設定 <small id="controlCount"></small></button>
<div id="error" role="alert" hidden></div>
<script type="module" src="./main.js?v=1"></script></body></html>
