<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebGPU Transparent Shallow Sea · 3 Pass</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061923;color:#e9fbff}canvas{width:100vw;height:100vh;display:block;image-rendering:auto}.panel{position:fixed;z-index:10;left:12px;top:12px;width:min(390px,calc(100vw - 24px));padding:12px 13px;border:1px solid #ffffff24;border-radius:12px;background:#03131add;backdrop-filter:blur(10px);box-shadow:0 14px 40px #00101855}.title{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:7px}.title b{font-size:14px}.status{font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9ad8df}.arch{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.arch span{padding:3px 6px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0d;font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#bce9ec}.controls{display:grid;gap:7px}.control{display:grid;grid-template-columns:78px 1fr 50px;gap:8px;align-items:center;font-size:11px}.control input{width:100%;accent-color:#57d4c7}.control output{text-align:right;color:#b7fff2;font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.note{margin-top:9px;color:#9bb8bd;font-size:10px;line-height:1.4}.ok{color:#9fffc0}.bad{color:#ff9b9b}@media(max-width:640px){.panel{top:auto;bottom:10px}.note{display:none}}
</style>
</head>
<body>
<canvas id="sea" width="480" height="270"></canvas>
<section class="panel">
  <div class="title"><b>Transparent Shallow Sea · 3 Pass</b><span id="status" class="status">boot</span></div>
  <div class="arch"><span>1 SEABED</span><span>2 SURFACE + FOAM MASK</span><span>3 COMPOSITE</span><span>DEPTH GUARD</span><span>SUN CAUSTICS</span></div>
  <div class="controls">
    <label class="control">水深<input id="depth" type="range" min="0.55" max="2.20" value="1.00" step="0.05"><output id="depthOut">1.00</output></label>
    <label class="control">波の強さ<input id="waves" type="range" min="0.20" max="2.00" value="1.00" step="0.05"><output id="wavesOut">1.00</output></label>
    <label class="control">透明度<input id="clarity" type="range" min="0.45" max="2.40" value="1.20" step="0.05"><output id="clarityOut">1.20</output></label>
    <label class="control">吸収係数<input id="absorption" type="range" min="0.35" max="2.40" value="1.00" step="0.05"><output id="absorptionOut">1.00</output></label>
    <label class="control">泡量<input id="foam" type="range" min="0.00" max="2.00" value="0.95" step="0.05"><output id="foamOut">0.95</output></label>
  </div>
  <div class="note">内部解像度 480×270固定。海底色+linear depth、水面データ+独立foam maskを別パスで生成し、最後に屈折ガード・Beer–Lambert・Fresnel・太陽方向causticsを合成。</div>
</section>
<script type="module">
const root=document.documentElement;
const statusEl=document.getElementById('status');
const canvas=document.getElementById('sea');
const ciMode=new URLSearchParams(location.search).has('ci');
const INTERNAL_W=480, INTERNAL_H=270;
const state={depth:1.00,waves:1.00,clarity:1.20,absorption:1.00,foam:0.95,uiRevision:0};
function stage(value){root.dataset.webgpuStage=value;statusEl.textContent=value;}
function fail(error){const msg=String(error?.stack||error);root.dataset.webgpuStatus='error';root.dataset.webgpuError=msg.slice(0,1800);statusEl.textContent='error';statusEl.className='bad';console.error(error);}
function bindRange(id,key,digits){const input=document.getElementById(id),out=document.getElementById(id+'Out');const apply=()=>{state[key]=Number(input.value);out.value=state[key].toFixed(digits);root.dataset[key]=String(state[key]);state.uiRevision++;root.dataset.uiRevision=String(state.uiRevision);};input.addEventListener('input',apply);apply();return input;}
const depthInput=bindRange('depth','depth',2),wavesInput=bindRange('waves','waves',2),clarityInput=bindRange('clarity','clarity',2),absorptionInput=bindRange('absorption','absorption',2),foamInput=bindRange('foam','foam',2);

const commonWGSL=String.raw`
struct UniformData {
  timeValue:f32, aspectValue:f32, widthValue:f32, heightValue:f32,
  depthValue:f32, waveStrength:f32, clarityValue:f32, absorptionValue:f32,
  foamAmount:f32, reservedA:f32, reservedB:f32, reservedC:f32
}
@group(0) @binding(0) var<uniform> uniforms:UniformData;
struct VertexOutput { @builtin(position) position:vec4f }
@vertex fn vertexMain(@builtin(vertex_index) vertexIndex:u32)->VertexOutput{
  var positions=array<vec2f,3>(vec2f(-1.0,-1.0),vec2f(3.0,-1.0),vec2f(-1.0,3.0));
  var output:VertexOutput; output.position=vec4f(positions[vertexIndex],0.0,1.0); return output;
}
fn saturate(value:f32)->f32{return clamp(value,0.0,1.0);}
fn hash21(point:vec2f)->f32{return fract(sin(dot(point,vec2f(127.1,311.7)))*43758.5453);}
fn noise2(point:vec2f)->f32{
  let cell=floor(point); let fraction=fract(point); let blend=fraction*fraction*(3.0-2.0*fraction);
  let a=hash21(cell); let b=hash21(cell+vec2f(1.0,0.0)); let c=hash21(cell+vec2f(0.0,1.0)); let d=hash21(cell+vec2f(1.0,1.0));
  return mix(mix(a,b,blend.x),mix(c,d,blend.x),blend.y);
}
fn waterHeight(horizontal:vec2f)->f32{
  let phase=uniforms.timeValue*0.65; let strength=uniforms.waveStrength;
  return strength*(0.045*sin(dot(horizontal,normalize(vec2f(0.86,0.52)))*2.25+phase*1.20)
       + 0.025*sin(dot(horizontal,normalize(vec2f(-0.35,0.94)))*4.10-phase*1.55)
       + 0.012*sin(dot(horizontal,normalize(vec2f(0.98,-0.18)))*7.20+phase*2.05));
}
fn waterNormal(horizontal:vec2f)->vec3f{
  let epsilon=0.018; let center=waterHeight(horizontal);
  let dx=waterHeight(horizontal+vec2f(epsilon,0.0)); let dz=waterHeight(horizontal+vec2f(0.0,epsilon));
  return normalize(vec3f(center-dx,epsilon,center-dz));
}
fn bottomHeight(horizontal:vec2f)->f32{
  let slope=0.075+0.045*uniforms.depthValue;
  let broad=0.10+horizontal.y*slope;
  let sandbar=0.055*exp(-pow(horizontal.y+2.1,2.0)*0.65)*sin(horizontal.x*0.65);
  let ripple=(noise2(horizontal*2.8)-0.5)*0.035;
  return broad+sandbar+ripple;
}
fn bottomNormal(horizontal:vec2f)->vec3f{
  let epsilon=0.028; let center=bottomHeight(horizontal);
  let dx=bottomHeight(horizontal+vec2f(epsilon,0.0)); let dz=bottomHeight(horizontal+vec2f(0.0,epsilon));
  return normalize(vec3f(center-dx,epsilon,center-dz));
}
fn cameraOrigin()->vec3f{return vec3f(0.0,1.35,4.2);}
fn cameraRay(uv:vec2f)->vec3f{
  let origin=cameraOrigin(); let cameraTarget=vec3f(0.0,-0.20,-4.0);
  let forwardDirection=normalize(cameraTarget-origin); let rightDirection=normalize(cross(forwardDirection,vec3f(0.0,1.0,0.0))); let upDirection=cross(rightDirection,forwardDirection);
  let screen=vec2f((uv.x*2.0-1.0)*uniforms.aspectValue,(1.0-uv.y)*2.0-1.0);
  return normalize(forwardDirection+rightDirection*screen.x*0.78+upDirection*screen.y*0.44);
}
fn skyColor(rayDirection:vec3f)->vec3f{
  let skyAmount=saturate(rayDirection.y*0.55+0.52); var sky=vec3f(0.72,0.90,0.98)+(vec3f(0.08,0.34,0.72)-vec3f(0.72,0.90,0.98))*pow(skyAmount,0.85);
  let sunDirection=normalize(vec3f(-0.30,0.78,-0.42)); let sunGlow=pow(max(dot(rayDirection,sunDirection),0.0),320.0); return sky+vec3f(1.0,0.87,0.58)*sunGlow*0.9;
}
fn solveWaterHit(rayOrigin:vec3f,rayDirection:vec3f)->f32{
   if(rayDirection.y>=-0.001){return -1.0;} var travel=(0.0-rayOrigin.y)/rayDirection.y;
  for(var iterationIndex:i32=0;iterationIndex<4;iterationIndex=iterationIndex+1){let samplePosition=rayOrigin+rayDirection*travel;travel=travel-(samplePosition.y-waterHeight(samplePosition.xz))/rayDirection.y;}
  return travel;
}
fn solveBottomHit(rayOrigin:vec3f,rayDirection:vec3f)->f32{
  if(rayDirection.y>=-0.001){return -1.0;} var travel=(-0.45-rayOrigin.y)/rayDirection.y;
  for(var iterationIndex:i32=0;iterationIndex<6;iterationIndex=iterationIndex+1){let samplePosition=rayOrigin+rayDirection*travel;travel=travel-(samplePosition.y-bottomHeight(samplePosition.xz))/rayDirection.y;}
  return travel;
}
fn sandColor(position:vec3f,rayDirection:vec3f,wetness:f32)->vec3f{
  let baseNoise=noise2(position.xz*3.6); var albedo=vec3f(0.91,0.80,0.60)+(vec3f(0.72,0.60,0.43)-vec3f(0.91,0.80,0.60))*baseNoise;
  albedo*=1.0-0.42*wetness; let surfaceNormal=bottomNormal(position.xz); let sunDirection=normalize(vec3f(-0.30,0.78,-0.42)); let diffuse=max(dot(surfaceNormal,sunDirection),0.0);
  let halfDirection=normalize(sunDirection-rayDirection); let specular=pow(max(dot(surfaceNormal,halfDirection),0.0),mix(18.0,70.0,wetness))*mix(0.02,0.20,wetness);
  return albedo*(0.28+0.78*diffuse)+vec3f(specular);
}
`;

const seabedWGSL=commonWGSL+String.raw`
