<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ANIMA — Anime Head Studio</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#2e2944;--muted:#857f9d;--plum:#6652a4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 42% 40%,#fffefc 0%,#f3eefb 53%,#e6dcf3 100%)}
body::before{content:"";pointer-events:none;position:absolute;inset:0;opacity:.5;background-image:radial-gradient(#ccbfec 1px,transparent 1px);background-size:31px 31px}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;outline:none}canvas:active{cursor:grabbing}
.decor{pointer-events:none;position:absolute;inset:0;overflow:hidden;z-index:0}.ring{position:absolute;width:min(66vw,650px);aspect-ratio:1;border:1px solid #bdb3dc77;border-radius:50%;top:50%;left:44%;transform:translate(-50%,-49%)}.ring::after{content:"";position:absolute;inset:8%;border:1px dashed #c2b4e67e;border-radius:50%}
.sparkle{position:absolute;color:#a59acb;opacity:.52;font-size:35px;animation:twinkle 4s ease-in-out infinite alternate}.s1{top:20%;left:27%}.s2{bottom:22%;left:18%;animation-delay:.8s;font-size:22px}.s3{top:24%;right:25%;animation-delay:1.1s;font-size:17px}@keyframes twinkle{to{opacity:.15;transform:scale(1.15) rotate(25deg)}}
.brand{position:absolute;top:39px;left:clamp(22px,5vw,72px);z-index:2;pointer-events:none}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.28em;color:#8c76bd}.brand h1{font-size:clamp(38px,4.4vw,66px);margin:5px 0 4px;letter-spacing:-.09em;font-weight:900;line-height:1}.brand h1 span{color:#8b76c4}.brand p{font-size:13px;color:#817b95;line-height:1.8;margin:10px 0 0}
.pill{position:absolute;top:42px;right:clamp(20px,4vw,60px);z-index:2;border:1px solid #ffffffc4;background:#ffffffba;box-shadow:0 5px 24px #65508b10;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.09em;color:#62577d;backdrop-filter:blur(12px)}
.controls{position:absolute;top:50%;transform:translateY(-45%);right:clamp(20px,4vw,58px);z-index:5;width:272px;background:#ffffffc9;border:1px solid #ffffffee;box-shadow:0 20px 80px #69539a22,0 2px 7px #b4a6d025;border-radius:25px;padding:26px 25px;backdrop-filter:blur(18px)}
.panel-title{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:850;letter-spacing:-.025em;margin:0 0 20px}.panel-title::before{content:'✦';color:#a58de7;font-size:19px}.group{margin:0 0 22px}.label{font-size:11px;font-weight:800;color:#817b95;letter-spacing:.09em;display:block;margin-bottom:12px}.swatches{display:flex;gap:13px}.swatch{width:35px;height:35px;border:none;border-radius:50%;cursor:pointer;position:relative;outline:2px solid transparent;outline-offset:3px;box-shadow:inset 0 0 0 2px #ffffff77,0 3px 10px #44315c21;transition:transform .16s}.swatch:hover{transform:translateY(-3px)}.swatch[aria-pressed="true"]{outline-color:#8774bf}.swatch[aria-pressed="true"]::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:white;text-shadow:0 1px 3px #555;font-weight:900}.swatch[data-hair="lilac"]{background:#6256a1}.swatch[data-hair="rose"]{background:#bd698e}.swatch[data-hair="cocoa"]{background:#79534e}.swatch[data-hair="ink"]{background:#35374f}.swatch[data-iris="aqua"]{background:#38b6af}.swatch[data-iris="violet"]{background:#9270da}.swatch[data-iris="amber"]{background:#d69b49}.swatch[data-iris="blue"]{background:#5f9de0}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#f2eef7;border-radius:13px;padding:4px}.segment button{cursor:pointer;background:transparent;border:0;border-radius:10px;font-size:11px;font-weight:750;color:#8f86a3;padding:10px 0;white-space:nowrap}.segment button[aria-pressed="true"]{background:#fff;color:#5c4a96;box-shadow:0 2px 9px #67508d18}
.actions{display:flex;gap:9px;border-top:1px solid #e8e0f0;padding-top:21px}.action{border:1px solid #e8e0f0;background:#fff;border-radius:12px;padding:10px 8px;font-size:11px;font-weight:800;color:#655a80;cursor:pointer;flex:1;transition:background .2s}.action:hover{background:#f2ecfe}.action.primary{background:#7562ba;color:white;border-color:#7562ba}
.caption{position:absolute;bottom:34px;left:clamp(25px,5vw,72px);z-index:2;font-weight:700;font-size:12px;color:#9186a8;display:flex;align-items:center;gap:12px;pointer-events:none}.drag-icon{font-size:21px;color:#9988c1}
.stats{position:absolute;bottom:34px;right:clamp(20px,4vw,58px);font-size:10px;font-weight:700;letter-spacing:.13em;color:#a59cb2;z-index:2}
#error{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fcf8ff;color:#4b3964;padding:20px;text-align:center}#error[hidden]{display:none}
@media(max-width:820px){.brand{top:17px;left:18px}.brand h1{font-size:35px}.eyebrow{font-size:9px}.brand p{font-size:11px;margin:6px 0}.pill{top:22px;right:14px;font-size:9px;padding:8px}.ring{width:75vw;top:37%;left:50%}.controls{width:auto;right:12px;left:12px;top:auto;bottom:max(9px,env(safe-area-inset-bottom));transform:none;padding:13px 17px 12px;border-radius:18px}.panel-title{font-size:12px;margin:0 0 10px}.group{display:inline-block;margin:0 14px 10px 0;vertical-align:top}.label{font-size:9px;margin-bottom:7px}.swatches{gap:9px}.swatch{width:27px;height:27px}.segment button{font-size:10px;padding:7px 5px}.actions{padding-top:10px}.action{padding:8px 5px}.caption,.stats{display:none}}
@media(max-width:420px){.brand p{max-width:180px}.group{margin-right:9px}.controls{padding:10px 14px}.swatches{gap:7px}.swatch{width:25px;height:25px}.actions{padding-top:8px}.group.expression-group{display:block;margin-top:0;margin-bottom:7px}.segment{display:flex}.segment button{flex:1}}
@media(prefers-reduced-motion:reduce){.sparkle{animation:none}}
</style></head><body>
<div class="decor" aria-hidden="true"><div class="ring"></div><span class="sparkle s1">✧</span><span class="sparkle s2">✦</span><span class="sparkle s3">✧</span></div>
<canvas id="scene" aria-label="インタラクティブなアニメ調3D頭部。ドラッグで回転、ホイールで拡大"></canvas>
<header class="brand"><div class="eyebrow">PROCEDURAL CHARACTER LAB / 01</div><h1>ANI<span>MA.</span></h1><p>アニメ顔、ゼロからつくる。<br>Pure JavaScript · No Three.js</p></header>
<div class="pill" id="render-mode">INITIALIZING…</div>
<aside class="controls" aria-label="キャラクター設定"><h2 class="panel-title">CHARACTER STUDIO</h2>
 <div class="group"><span class="label">HAIR COLOR / 髪色</span><div class="swatches">
  <button class="swatch" data-hair="lilac" aria-label="紫色の髪" aria-pressed="true"></button>
  <button class="swatch" data-hair="rose" aria-label="ピンク色の髪" aria-pressed="false"></button>
  <button class="swatch" data-hair="cocoa" aria-label="茶色の髪" aria-pressed="false"></button>
  <button class="swatch" data-hair="ink" aria-label="黒色の髪" aria-pressed="false"></button>
 </div></div>
 <div class="group"><span class="label">EYE COLOR / 瞳の色</span><div class="swatches">
  <button class="swatch" data-iris="aqua" aria-label="アクアの瞳" aria-pressed="true"></button>
  <button class="swatch" data-iris="violet" aria-label="紫の瞳" aria-pressed="false"></button>
  <button class="swatch" data-iris="amber" aria-label="琥珀色の瞳" aria-pressed="false"></button>
  <button class="swatch" data-iris="blue" aria-label="青い瞳" aria-pressed="false"></button>
 </div></div>
 <div class="group expression-group"><span class="label">EXPRESSION / 表情 <span id="expression-label" style="color:#a59ac1;font-weight:500">ふつう</span></span>
  <div class="segment" role="group" aria-label="表情選択"><button data-expression="neutral" aria-pressed="true">ふつう</button><button data-expression="happy" aria-pressed="false">にっこり</button><button data-expression="surprised" aria-pressed="false">びっくり</button></div>
 </div>
 <div class="actions"><button class="action primary" id="motion" aria-pressed="true">Ⅱ アニメ停止</button><button class="action" id="reset">↺ 視点リセット</button></div>
</aside>
<div class="caption"><span class="drag-icon">⟲</span> DRAG TO ROTATE <span style="opacity:.45">/</span> SCROLL TO ZOOM</div>
<div class="stats" id="tri-count">— triangles</div><div id="error" hidden>Canvasを初期化できませんでした。</div>
<script src="./geometry.js"></script><script src="./renderer.js"></script>
</body></html>
