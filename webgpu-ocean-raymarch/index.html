<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>WebGPU Raymarched Shoreline</title>
<style>
  :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111511; color: #f0eee5; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; left: 14px; top: 14px; width: min(340px, calc(100vw - 28px)); padding: 14px; border: 1px solid rgba(240,238,229,.16); border-radius: 16px; background: rgba(20,24,20,.72); backdrop-filter: blur(12px); box-shadow: 0 16px 50px rgba(0,0,0,.28); }
  .title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; font-weight: 650; }
  .status { font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: #d9d4bf; opacity: .86; }
  .controls { display: grid; gap: 9px; }
  label { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; color: #e4dfd1; }
  input[type=range] { width: 100%; accent-color: #c5aa63; }
  output { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; color: #d7cda9; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { appearance: none; border: 1px solid rgba(240,238,229,.18); background: rgba(240,238,229,.07); color: #f0eee5; border-radius: 10px; padding: 7px 10px; font-size: 12px; cursor: pointer; }
  button:hover { background: rgba(240,238,229,.12); }
  .hint { margin-top: 9px; font-size: 11px; line-height: 1.5; color: #bdb9aa; }
  .error { color: #ffb4a5; white-space: pre-wrap; }
  @media (max-width: 600px) { .panel { top: auto; bottom: 12px; } .hint { display: none; } }
</style>
</head>
<body>
<canvas id="gpuCanvas" aria-label="WebGPUで描画したレイマーチ海面"></canvas>
<section class="panel">
  <div class="title"><h1>Raymarched Shoreline</h1><span id="status" class="status">boot</span></div>
  <div class="controls">
    <label>Sea state <input id="sea" type="range" min="0.2" max="2.2" step="0.01" value="1.0"><output id="seaOut">1.00</output></label>
    <label>Choppiness <input id="chop" type="range" min="0.2" max="2.0" step="0.01" value="1.0"><output id="chopOut">1.00</output></label>
    <label>Water clarity <input id="clarity" type="range" min="0.40" max="2.50" step="0.05" value="1.35"><output id="clarityOut">1.35</output></label>
    <label>Sun height <input id="sun" type="range" min="0.05" max="0.95" step="0.01" value="0.34"><output id="sunOut">0.34</output></label>
    <label>Resolution <input id="quality" type="range" min="0.45" max="1" step="0.05" value="0.80"><output id="qualityOut">0.80</output></label>
  </div>
  <div class="row"><button id="pause">Pause</button><button id="reset">Reset camera</button></div>
  <div class="hint">Drag: look around · Wheel: camera height. Sand and water are separate height fields. Rays hit dry beach directly; after a water hit, a refracted ray continues through the water to the sandy bottom.</div>
</section>
<script type="module">
const canvasElement = document.querySelector('#gpuCanvas');
const statusElement = document.querySelector('#status');
const ciMode = new URLSearchParams(location.search).has('ci');
const stage = (name) => {
  document.documentElement.dataset.webgpuTest = name;
  statusElement.textContent = name;
};
const fail = (errorValue) => {
  const message = errorValue instanceof Error ? (errorValue.stack || errorValue.message) : String(errorValue);
  document.documentElement.dataset.webgpuTest = 'failed';
  document.documentElement.dataset.webgpuError = message.slice(0, 1000);
  statusElement.textContent = 'failed';
  statusElement.classList.add('error');
  console.error(errorValue);
};
stage('script-start');

const shaderCode = /* wgsl */`
struct UniformBlock {
  timingResolution: vec4f,
  cameraState: vec4f,
  oceanState: vec4f,
  sunState: vec4f,
}

@group(0) @binding(0) var<uniform> uniforms: UniformBlock;

struct VertexOutput {
  @builtin(position) clipPosition: vec4f,
}

@vertex
fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
  var outputValue: VertexOutput;
  var fullScreenPosition = vec2f(0.0, 0.0);
  if (vertexIndex == 0u) {
    fullScreenPosition = vec2f(-1.0, -1.0);
  } else if (vertexIndex == 1u) {
    fullScreenPosition = vec2f(3.0, -1.0);
  } else {
    fullScreenPosition = vec2f(-1.0, 3.0);
  }
  outputValue.clipPosition = vec4f(fullScreenPosition, 0.0, 1.0);
  return outputValue;
}

fn saturateValue(inputValue: f32) -> f32 {
  return clamp(inputValue, 0.0, 1.0);
}

fn easedValue(inputValue: f32) -> f32 {
  let clampedValue = saturateValue(inputValue);
  return clampedValue * clampedValue * (3.0 - 2.0 * clampedValue);
}

fn blendColor(colorA: vec3f, colorB: vec3f, blendFactor: f32) -> vec3f {
  return colorA * (1.0 - blendFactor) + colorB * blendFactor;
}


fn beachTerrainHeight(positionXZ: vec2f) -> f32 {
  let coastlineWobble =
      sin(positionXZ.x * 0.18) * 0.55 +
      sin(positionXZ.x * 0.47 + 1.7) * 0.18;
  let shoreCoordinate = positionXZ.y + coastlineWobble;
  let broadSlope = -0.60 - shoreCoordinate * 0.22;
  let duneShape =
      sin(positionXZ.x * 0.24 + positionXZ.y * 0.07) * 0.10 +
      sin(positionXZ.x * 0.83 - positionXZ.y * 0.18 + 0.8) * 0.025;
  let sandRipple = sin(positionXZ.x * 2.3 + sin(positionXZ.y * 0.70)) * 0.018;
  return broadSlope + duneShape + sandRipple;
}

fn shorelineWaterFactor(positionXZ: vec2f) -> f32 {
  let localDepth = -beachTerrainHeight(positionXZ);
  return smoothstep(0.02, 0.85, localDepth);
}

fn waveHeight(positionXZ: vec2f, timeValue: f32) -> f32 {
  let seaStrength = uniforms.oceanState.x;
  let chopStrength = uniforms.oceanState.y;
  var heightValue = 0.0;

  let directionA = normalize(vec2f(1.0, 0.28));
  let directionB = normalize(vec2f(-0.42, 1.0));
  let directionC = normalize(vec2f(0.72, -0.68));
  let directionD = normalize(vec2f(-0.92, -0.24));
  let directionE = normalize(vec2f(0.18, 0.98));

  heightValue += sin(dot(positionXZ, directionA) * 0.34 + timeValue * 0.72) * 0.54;
  heightValue += sin(dot(positionXZ, directionB) * 0.53 + timeValue * 0.93 + 1.7) * 0.31;
  heightValue += sin(dot(positionXZ, directionC) * 0.91 + timeValue * 1.18 + 4.1) * 0.16;
  heightValue += sin(dot(positionXZ, directionD) * 1.73 + timeValue * 1.62 + 2.4) * 0.075 * chopStrength;
  heightValue += sin(dot(positionXZ, directionE) * 3.10 + timeValue * 2.15 + sin(positionXZ.x * 0.23)) * 0.035 * chopStrength;

  let crossingValue = sin(positionXZ.x * 1.35 + timeValue * 1.27) * sin(positionXZ.y * 1.08 - timeValue * 1.11);
  heightValue += crossingValue * 0.055 * chopStrength;
  return heightValue * seaStrength * shorelineWaterFactor(positionXZ);
}

fn oceanNormal(positionXZ: vec2f, timeValue: f32) -> vec3f {
  let sampleDistance = 0.045;
  let leftHeight = waveHeight(positionXZ - vec2f(sampleDistance, 0.0), timeValue);
  let rightHeight = waveHeight(positionXZ + vec2f(sampleDistance, 0.0), timeValue);
  let backHeight = waveHeight(positionXZ - vec2f(0.0, sampleDistance), timeValue);
  let frontHeight = waveHeight(positionXZ + vec2f(0.0, sampleDistance), timeValue);
  let slopeX = (leftHeight - rightHeight) / (2.0 * sampleDistance);
  let slopeZ = (backHeight - frontHeight) / (2.0 * sampleDistance);
  return normalize(vec3f(slopeX, 1.0, slopeZ));
}


fn beachNormal(positionXZ: vec2f) -> vec3f {
  let sampleDistance = 0.06;
  let leftHeight = beachTerrainHeight(positionXZ - vec2f(sampleDistance, 0.0));
  let rightHeight = beachTerrainHeight(positionXZ + vec2f(sampleDistance, 0.0));
  let backHeight = beachTerrainHeight(positionXZ - vec2f(0.0, sampleDistance));
  let frontHeight = beachTerrainHeight(positionXZ + vec2f(0.0, sampleDistance));
  let slopeX = (leftHeight - rightHeight) / (2.0 * sampleDistance);
  let slopeZ = (backHeight - frontHeight) / (2.0 * sampleDistance);
  return normalize(vec3f(slopeX, 1.0, slopeZ));
}

fn sandBaseColor(positionXZ: vec2f, terrainHeight: f32) -> vec3f {
  let ripplePattern =
      0.5 + 0.5 * sin(positionXZ.x * 2.8 + sin(positionXZ.y * 0.62) * 1.4);
  let fineVariation =
      0.5 + 0.5 * sin(positionXZ.x * 0.41 + positionXZ.y * 0.29 + 1.3);
  let drySand = vec3f(0.78, 0.66, 0.46);
  let paleSand = vec3f(0.91, 0.82, 0.62);
  let wetSand = vec3f(0.42, 0.36, 0.27);
  var sandValue = blendColor(drySand, paleSand, ripplePattern * 0.28 + fineVariation * 0.10);
  let wetAmount = 1.0 - smoothstep(0.06, 0.72, abs(terrainHeight));
  sandValue = blendColor(sandValue, wetSand, wetAmount * 0.55);
  return sandValue;
}

fn intersectBeach(rayOrigin: vec3f, rayDirection: vec3f) -> f32 {
  var previousDistance = 0.05;
  var previousPosition = rayOrigin + rayDirection * previousDistance;
  var previousField = previousPosition.y - beachTerrainHeight(previousPosition.xz);
  var hitDistance = -1.0;
  var travelDistance = previousDistance;

  for (var stepIndex = 0; stepIndex < 160; stepIndex = stepIndex + 1) {
    let stepLength = clamp(0.10 + travelDistance * 0.014, 0.10, 1.5);
    travelDistance += stepLength;
    if (travelDistance > 220.0) {
      break;
    }
    let samplePosition = rayOrigin + rayDirection * travelDistance;
    let fieldValue = samplePosition.y - beachTerrainHeight(samplePosition.xz);
    if (fieldValue <= 0.0 && previousField > 0.0) {
      var lowerDistance = previousDistance;
      var upperDistance = travelDistance;
      for (var refineIndex = 0; refineIndex < 9; refineIndex = refineIndex + 1) {
        let middleDistance = (lowerDistance + upperDistance) * 0.5;
        let middlePosition = rayOrigin + rayDirection * middleDistance;
        let middleField = middlePosition.y - beachTerrainHeight(middlePosition.xz);
        if (middleField > 0.0) {
          lowerDistance = middleDistance;
        } else {
          upperDistance = middleDistance;
        }
      }
      hitDistance = (lowerDistance + upperDistance) * 0.5;
      break;
    }
    previousDistance = travelDistance;
    previousField = fieldValue;
  }
  return hitDistance;
}

fn litSandColor(surfacePosition: vec3f, surfaceNormal: vec3f, sunDirection: vec3f) -> vec3f {
  let baseColor = sandBaseColor(surfacePosition.xz, surfacePosition.y);
  let sunDiffuse = max(dot(surfaceNormal, sunDirection), 0.0);
  let skyFill = 0.38 + 0.18 * surfaceNormal.y;
  return baseColor * (skyFill + sunDiffuse * 0.62);
}

fn skyColor(rayDirection: vec3f, sunDirection: vec3f) -> vec3f {
  let horizonAmount = pow(saturateValue(1.0 - max(rayDirection.y, 0.0)), 2.2);
  let upperSky = vec3f(0.18, 0.31, 0.39);
  let horizonSky = vec3f(0.78, 0.72, 0.59);
  var colorValue = blendColor(upperSky, horizonSky, horizonAmount);

  let sunAlignment = max(dot(rayDirection, sunDirection), 0.0);
  let sunDisc = pow(sunAlignment, 900.0);
  let sunGlow = pow(sunAlignment, 18.0) * 0.22;
  colorValue += vec3f(1.0, 0.73, 0.38) * sunGlow;
  colorValue += vec3f(1.0, 0.90, 0.67) * sunDisc * 7.0;
  return colorValue;
}

fn intersectOcean(rayOrigin: vec3f, rayDirection: vec3f, timeValue: f32) -> vec2f {
  var previousDistance = 0.08;
  var previousPosition = rayOrigin + rayDirection * previousDistance;
  var previousField = previousPosition.y - waveHeight(previousPosition.xz, timeValue);

  var hitDistance = -1.0;
  var travelDistance = previousDistance;
  for (var stepIndex = 0; stepIndex < 128; stepIndex = stepIndex + 1) {
    let stepLength = clamp(0.12 + travelDistance * 0.017, 0.12, 1.6);
    travelDistance += stepLength;
    if (travelDistance > 180.0) {
      break;
    }
    let samplePosition = rayOrigin + rayDirection * travelDistance;
    let fieldValue = samplePosition.y - waveHeight(samplePosition.xz, timeValue);
    if (fieldValue <= 0.0 && previousField > 0.0) {
      var lowerDistance = previousDistance;
      var upperDistance = travelDistance;
      for (var refineIndex = 0; refineIndex < 9; refineIndex = refineIndex + 1) {
        let middleDistance = (lowerDistance + upperDistance) * 0.5;
        let middlePosition = rayOrigin + rayDirection * middleDistance;
        let middleField = middlePosition.y - waveHeight(middlePosition.xz, timeValue);
        if (middleField > 0.0) {
          lowerDistance = middleDistance;
        } else {
          upperDistance = middleDistance;
        }
      }
      hitDistance = (lowerDistance + upperDistance) * 0.5;
      break;
    }
    previousDistance = travelDistance;
    previousField = fieldValue;
  }
  return vec2f(hitDistance, travelDistance);
}

fn cameraRay(screenPosition: vec2f, yawValue: f32, pitchValue: f32) -> vec3f {
  let cosineYaw = cos(yawValue);
  let sineYaw = sin(yawValue);
  let cosinePitch = cos(pitchValue);
  let sinePitch = sin(pitchValue);
  let forwardVector = normalize(vec3f(sineYaw * cosinePitch, sinePitch, cosineYaw * cosinePitch));
  let rightVector = normalize(vec3f(cosineYaw, 0.0, -sineYaw));
  let upVector = normalize(cross(forwardVector, rightVector));
  return normalize(forwardVector + rightVector * screenPosition.x + upVector * screenPosition.y);
}

@fragment
fn fragmentMain(@builtin(position) fragmentPosition: vec4f) -> @location(0) vec4f {
  let resolutionValue = uniforms.timingResolution.yz;
  var screenPosition = (fragmentPosition.xy / resolutionValue) * 2.0 - vec2f(1.0, 1.0);
  screenPosition.y = -screenPosition.y;
  screenPosition.x *= resolutionValue.x / resolutionValue.y;
  screenPosition *= 0.72;

  let timeValue = uniforms.timingResolution.x;
  let yawValue = uniforms.cameraState.x;
  let pitchValue = uniforms.cameraState.y;
  let cameraHeight = uniforms.cameraState.z;
  let rayOrigin = vec3f(0.0, cameraHeight, -10.0);
  let rayDirection = cameraRay(screenPosition, yawValue, pitchValue);

  let sunHeight = uniforms.sunState.x;
  let sunAzimuth = uniforms.sunState.y;
  let sunHorizontal = sqrt(max(1.0 - sunHeight * sunHeight, 0.0));
  let sunDirection = normalize(vec3f(cos(sunAzimuth) * sunHorizontal, sunHeight, sin(sunAzimuth) * sunHorizontal));

  if (rayDirection.y >= 0.18) {
    let backgroundColor = skyColor(rayDirection, sunDirection);
    return vec4f(backgroundColor, 1.0);
  }

  let beachHitDistance = intersectBeach(rayOrigin, rayDirection);
  let waterHitInfo = intersectOcean(rayOrigin, rayDirection, timeValue);
  let waterHitDistance = waterHitInfo.x;

  if (beachHitDistance > 0.0 && (waterHitDistance < 0.0 || beachHitDistance < waterHitDistance)) {
    let beachPosition = rayOrigin + rayDirection * beachHitDistance;
    let beachSurfaceNormal = beachNormal(beachPosition.xz);
    var beachColor = litSandColor(beachPosition, beachSurfaceNormal, sunDirection);
    let shoreDarkening = 1.0 - smoothstep(0.02, 0.48, abs(beachPosition.y));
    beachColor *= 1.0 - shoreDarkening * 0.18;
    let beachHaze = easedValue(beachHitDistance / 155.0);
    beachColor = blendColor(beachColor, skyColor(rayDirection, sunDirection), beachHaze * 0.34);
    let beachExposure = vec3f(1.0, 1.0, 1.0) - exp(-beachColor * 1.18);
    let beachGamma = pow(beachExposure, vec3f(0.4545, 0.4545, 0.4545));
    return vec4f(beachGamma, 1.0);
  }

  if (waterHitDistance < 0.0) {
    let backgroundColor = skyColor(rayDirection, sunDirection);
    return vec4f(backgroundColor, 1.0);
  }

  let surfacePosition = rayOrigin + rayDirection * waterHitDistance;
  let surfaceNormal = oceanNormal(surfacePosition.xz, timeValue);
  let reflectedDirection = reflect(rayDirection, surfaceNormal);
  let reflectedSky = skyColor(reflectedDirection, sunDirection);

  let refractedDirectionRaw = refract(rayDirection, surfaceNormal, 1.0 / 1.333);
  let refractedDirection = normalize(refractedDirectionRaw);
  let underwaterOrigin = surfacePosition - surfaceNormal * 0.035;
  let bottomHitDistance = intersectBeach(underwaterOrigin, refractedDirection);

  var transmittedColor = vec3f(0.008, 0.105, 0.115);
  var underwaterPathLength = 12.0;
  var shorelineFoam = 0.0;
  if (bottomHitDistance > 0.0) {
    underwaterPathLength = bottomHitDistance;
    let bottomPosition = underwaterOrigin + refractedDirection * bottomHitDistance;
    let bottomSurfaceNormal = beachNormal(bottomPosition.xz);
    var bottomColor = litSandColor(bottomPosition, bottomSurfaceNormal, sunDirection);
    let causticPattern =
        0.5 + 0.5 * sin(bottomPosition.x * 2.8 + timeValue * 1.7 + sin(bottomPosition.z * 1.2)) *
                    sin(bottomPosition.z * 2.1 - timeValue * 1.25);
    bottomColor *= 0.82 + causticPattern * 0.26;

    let clarityValue = max(uniforms.oceanState.z, 0.20);
    let absorption = vec3f(0.72, 0.24, 0.10) / clarityValue;
    let transmittance = exp(-absorption * underwaterPathLength);
    let scatterColor = vec3f(0.012, 0.16, 0.17);
    transmittedColor = bottomColor * transmittance + scatterColor * (vec3f(1.0, 1.0, 1.0) - transmittance);

    let shallowAmount = 1.0 - smoothstep(0.18, 0.78, underwaterPathLength);
    let foamStripe = 0.55 + 0.45 * sin(surfacePosition.x * 3.2 + surfacePosition.z * 1.4 - timeValue * 2.4);
    shorelineFoam = shallowAmount * saturateValue(foamStripe * 0.85 + 0.15);
  }

  let viewFacing = saturateValue(dot(-rayDirection, surfaceNormal));
  let fresnelValue = 0.020 + 0.980 * pow(1.0 - viewFacing, 5.0);
  let reflectionAmount = saturateValue(0.045 + fresnelValue * 0.92);
  var oceanColor = blendColor(transmittedColor, reflectedSky, reflectionAmount);

  let slopeAmount = 1.0 - surfaceNormal.y;
  let crestHeight = waveHeight(surfacePosition.xz, timeValue);
  let crestFoamBase = saturateValue((slopeAmount - 0.14) * 5.2 + (crestHeight - 0.42) * 1.2);
  let crestFoam = crestFoamBase * crestFoamBase * (0.20 + 0.80 * uniforms.oceanState.y);
  let totalFoam = saturateValue(crestFoam * 0.34 + shorelineFoam * 0.62);
  oceanColor = blendColor(oceanColor, vec3f(0.88, 0.89, 0.82), totalFoam);

  let reflectedSun = pow(max(dot(reflectedDirection, sunDirection), 0.0), 120.0);
  oceanColor += vec3f(1.0, 0.76, 0.41) * reflectedSun * 2.1;
  let distanceHaze = easedValue(waterHitDistance / 150.0);
  oceanColor = blendColor(oceanColor, skyColor(rayDirection, sunDirection), distanceHaze * 0.46);

  let exposureColor = vec3f(1.0, 1.0, 1.0) - exp(-oceanColor * 1.22);
  let gammaColor = pow(exposureColor, vec3f(0.4545, 0.4545, 0.4545));
  return vec4f(gammaColor, 1.0);
}
`;

async function startApp() {
  if (!navigator.gpu) throw new Error('WebGPU is not available in this browser.');
  stage('request-adapter');
  const gpuAdapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!gpuAdapter) throw new Error('requestAdapter() returned null.');
  stage('request-device');
  const gpuDevice = await gpuAdapter.requestDevice();
  gpuDevice.lost.then((lostInfo) => {
    console.error('device.lost', lostInfo.reason, lostInfo.message);
    if (document.documentElement.dataset.webgpuTest !== 'ok') fail(new Error(`device lost: ${lostInfo.reason}: ${lostInfo.message}`));
  });

  const shaderModule = gpuDevice.createShaderModule({ code: shaderCode });
  stage('shader-compilation-info');
  const compilationInfo = await shaderModule.getCompilationInfo();
  const compilationErrors = compilationInfo.messages.filter((entry) => entry.type === 'error');
  if (compilationErrors.length) throw new Error(compilationErrors.map((entry) => `${entry.lineNum}:${entry.linePos} ${entry.message}`).join('\n'));

  const preferredFormat = navigator.gpu.getPreferredCanvasFormat();
  const uniformBuffer = gpuDevice.createBuffer({
    size: 64,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  const bindGroupLayout = gpuDevice.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } }],
  });
  const pipelineLayout = gpuDevice.createPipelineLayout({ bindGroupLayouts: [bindGroupLayout] });
  stage('create-pipeline');
  gpuDevice.pushErrorScope('validation');
  const renderPipeline = await gpuDevice.createRenderPipelineAsync({
    layout: pipelineLayout,
    vertex: { module: shaderModule, entryPoint: 'vertexMain' },
    fragment: { module: shaderModule, entryPoint: 'fragmentMain', targets: [{ format: preferredFormat }] },
    primitive: { topology: 'triangle-list' },
  });
  const bindGroup = gpuDevice.createBindGroup({
    layout: bindGroupLayout,
    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
  });

  const parameters = {
    sea: 1.0,
    chop: 1.0,
    sun: 0.34,
    quality: 0.80,
    clarity: 1.35,
    yaw: 0.0,
    pitch: -0.14,
    height: 3.4,
    paused: false,
  };

  const writeUniforms = (timeSeconds, widthValue, heightValue) => {
    const dataValues = new Float32Array(16);
    dataValues.set([timeSeconds, widthValue, heightValue, 0.0], 0);
    dataValues.set([parameters.yaw, parameters.pitch, parameters.height, 0.0], 4);
    dataValues.set([parameters.sea, parameters.chop, parameters.clarity, 0.0], 8);
    dataValues.set([parameters.sun, -0.82, 0.0, 0.0], 12);
    gpuDevice.queue.writeBuffer(uniformBuffer, 0, dataValues);
  };

  const encodeRenderPass = (textureView, widthValue, heightValue, timeSeconds, commandEncoder) => {
    writeUniforms(timeSeconds, widthValue, heightValue);
    const renderPass = commandEncoder.beginRenderPass({
      colorAttachments: [{ view: textureView, clearValue: { r: 0.02, g: 0.025, b: 0.02, a: 1.0 }, loadOp: 'clear', storeOp: 'store' }],
    });
    renderPass.setPipeline(renderPipeline);
    renderPass.setBindGroup(0, bindGroup);
    renderPass.draw(3);
    renderPass.end();
  };

  if (ciMode) {
    const ciWidth = 64;
    const ciHeight = 64;
    const offscreenTexture = gpuDevice.createTexture({
      size: [ciWidth, ciHeight, 1],
      format: preferredFormat,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
    });
    const bytesPerRow = 256;
    const readbackBuffer = gpuDevice.createBuffer({
      size: bytesPerRow * ciHeight,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
    });
    stage('validation-scope');
    const commandEncoder = gpuDevice.createCommandEncoder();
    encodeRenderPass(offscreenTexture.createView(), ciWidth, ciHeight, 1.25, commandEncoder);
    commandEncoder.copyTextureToBuffer(
      { texture: offscreenTexture },
      { buffer: readbackBuffer, bytesPerRow, rowsPerImage: ciHeight },
      [ciWidth, ciHeight, 1],
    );
    gpuDevice.queue.submit([commandEncoder.finish()]);
    stage('submitted-work-wait');
    await gpuDevice.queue.onSubmittedWorkDone();
    const validationError = await gpuDevice.popErrorScope();
    if (validationError) throw validationError;
    await readbackBuffer.mapAsync(GPUMapMode.READ);
    const mappedBytes = new Uint8Array(readbackBuffer.getMappedRange());
    const centerOffset = 32 * bytesPerRow + 32 * 4;
    const pixelSum = mappedBytes[centerOffset] + mappedBytes[centerOffset + 1] + mappedBytes[centerOffset + 2] + mappedBytes[centerOffset + 3];
    readbackBuffer.unmap();
    if (pixelSum === 0) throw new Error('Readback pixel is unexpectedly zero.');
    document.documentElement.dataset.webgpuPixelSum = String(pixelSum);
    stage('ok');
    return;
  }

  const canvasContext = canvasElement.getContext('webgpu');
  if (!canvasContext) throw new Error('Could not obtain a WebGPU canvas context.');
  let canvasWidth = 1;
  let canvasHeight = 1;
  let configured = false;
  let renderTime = 0;
  let previousFrameTime = performance.now();
  let fpsAccumulator = 0;
  let fpsFrames = 0;
  let fpsDisplay = 0;

  const configureCanvas = () => {
    const devicePixelRatioValue = Math.min(devicePixelRatio || 1, 2);
    const displayWidth = Math.max(1, Math.floor(canvasElement.clientWidth * devicePixelRatioValue * parameters.quality));
    const displayHeight = Math.max(1, Math.floor(canvasElement.clientHeight * devicePixelRatioValue * parameters.quality));
    if (displayWidth === canvasWidth && displayHeight === canvasHeight && configured) return;
    canvasWidth = displayWidth;
    canvasHeight = displayHeight;
    canvasElement.width = canvasWidth;
    canvasElement.height = canvasHeight;
    canvasContext.configure({ device: gpuDevice, format: preferredFormat, alphaMode: 'opaque' });
    configured = true;
  };

  const frame = (frameTime) => {
    configureCanvas();
    const deltaSeconds = Math.min((frameTime - previousFrameTime) / 1000, 0.1);
    previousFrameTime = frameTime;
    if (!parameters.paused) renderTime += deltaSeconds;
    const commandEncoder = gpuDevice.createCommandEncoder();
    encodeRenderPass(canvasContext.getCurrentTexture().createView(), canvasWidth, canvasHeight, renderTime, commandEncoder);
    gpuDevice.queue.submit([commandEncoder.finish()]);

    fpsAccumulator += deltaSeconds;
    fpsFrames += 1;
    if (fpsAccumulator >= 0.5) {
      fpsDisplay = Math.round(fpsFrames / fpsAccumulator);
      fpsAccumulator = 0;
      fpsFrames = 0;
      statusElement.textContent = `${fpsDisplay} fps · ${canvasWidth}×${canvasHeight}`;
    }
    requestAnimationFrame(frame);
  };

  const ranges = [
    ['sea', 'seaOut', 'sea'],
    ['chop', 'chopOut', 'chop'],
    ['clarity', 'clarityOut', 'clarity'],
    ['sun', 'sunOut', 'sun'],
    ['quality', 'qualityOut', 'quality'],
  ];
  for (const [inputId, outputId, parameterName] of ranges) {
    const inputElement = document.getElementById(inputId);
    const outputElement = document.getElementById(outputId);
    inputElement.addEventListener('input', () => {
      parameters[parameterName] = Number(inputElement.value);
      outputElement.value = parameters[parameterName].toFixed(2);
      if (parameterName === 'quality') configured = false;
    });
  }

  document.getElementById('pause').addEventListener('click', (event) => {
    parameters.paused = !parameters.paused;
    event.currentTarget.textContent = parameters.paused ? 'Resume' : 'Pause';
  });
  document.getElementById('reset').addEventListener('click', () => {
    parameters.yaw = 0.0;
    parameters.pitch = -0.14;
    parameters.height = 3.4;
  });

  let dragging = false;
  let previousX = 0;
  let previousY = 0;
  canvasElement.addEventListener('pointerdown', (event) => {
    dragging = true;
    previousX = event.clientX;
    previousY = event.clientY;
    canvasElement.setPointerCapture(event.pointerId);
  });
  canvasElement.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    parameters.yaw -= (event.clientX - previousX) * 0.004;
    parameters.pitch = Math.max(-0.62, Math.min(0.10, parameters.pitch + (event.clientY - previousY) * 0.003));
    previousX = event.clientX;
    previousY = event.clientY;
  });
  canvasElement.addEventListener('pointerup', () => { dragging = false; });
  canvasElement.addEventListener('pointercancel', () => { dragging = false; });
  canvasElement.addEventListener('wheel', (event) => {
    event.preventDefault();
    parameters.height = Math.max(0.8, Math.min(18.0, parameters.height + event.deltaY * 0.008));
  }, { passive: false });

  const initialValidationError = await gpuDevice.popErrorScope();
  if (initialValidationError) throw initialValidationError;
  stage('ok');
  requestAnimationFrame((timeValue) => {
    previousFrameTime = timeValue;
    requestAnimationFrame(frame);
  });
}

startApp().catch(fail);
</script>
</body>
</html>
