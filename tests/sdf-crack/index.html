<!doctype html>
<html lang="ja" data-webgpu-status="starting" data-render-revision="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SDF Crack WebGPU Test</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101b;color:#eaf2ff;font-family:system-ui,-apple-system,sans-serif}
canvas{width:100vw;height:100vh;display:block}
#panel{position:fixed;left:16px;top:16px;width:min(340px,calc(100vw - 32px));box-sizing:border-box;padding:14px 15px 13px;border:1px solid #ffffff1f;border-radius:14px;background:#07101bd9;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0007}
#panel h1{font-size:17px;margin:0 0 5px}
#panel p{font-size:12px;line-height:1.45;color:#b8c7dc;margin:0 0 10px}
.control{margin:9px 0}
.control label{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.control output{font:12px ui-monospace,monospace;color:#9fd0ff}
.control input,.control select{width:100%;margin:4px 0 0}
.control select{box-sizing:border-box;padding:7px 8px;border-radius:8px;border:1px solid #ffffff26;background:#101b29;color:#eaf2ff}
#resetButton{margin-top:5px;padding:6px 10px;border-radius:8px;border:1px solid #ffffff26;background:#ffffff12;color:#eaf2ff}
#state{position:fixed;left:12px;bottom:12px;padding:7px 9px;background:#0009;border-radius:8px;font:11px ui-monospace,monospace;white-space:pre-wrap;pointer-events:none}
@media(max-width:620px){#panel{left:10px;top:10px;width:calc(100vw - 20px);padding:11px 12px}.control{margin:6px 0}}
</style>
</head>
<body>
<canvas id="gpuCanvas"></canvas>
<section id="panel">
  <h1>SDF fracture / pre-break</h1>
  <p>亀裂はテクスチャではなく、球のSDFから空隙を差し引いています。ドラッグで回転、ホイールでズーム。</p>
  <div class="control">
    <label for="loadSlider"><span>Fracture load</span><output id="loadValue">0.700</output></label>
    <input id="loadSlider" type="range" min="0.000" max="1.000" step="0.005" value="0.700">
  </div>
  <div class="control">
    <label for="modeSelect"><span>Crack model</span><output id="modeValue">Fissure</output></label>
    <select id="modeSelect" data-param="mode">
      <option value="0">Hairline</option>
      <option value="1" selected>Fissure</option>
      <option value="2">Impact</option>
      <option value="3">Network</option>
      <option value="4">Opening warp</option>
      <option value="5">Intact reference</option>
    </select>
  </div>
  <div class="control">
    <label for="openingSlider"><span>Crack opening</span><output id="openingValue">0.045</output></label>
    <input id="openingSlider" data-param="opening" type="range" min="0.002" max="0.120" step="0.001" value="0.045">
  </div>
  <div class="control">
    <label for="lengthSlider"><span>Crack length</span><output id="lengthValue">0.720</output></label>
    <input id="lengthSlider" data-param="length" type="range" min="0.050" max="1.000" step="0.005" value="0.720">
  </div>
  <div class="control">
    <label for="dangerSlider"><span>Pre-fracture danger</span><output id="dangerValue">0.780</output></label>
    <input id="dangerSlider" data-param="danger" type="range" min="0.000" max="1.000" step="0.005" value="0.780">
  </div>
  <div class="control">
    <label for="branchSlider"><span>Branch amount</span><output id="branchValue">0.350</output></label>
    <input id="branchSlider" data-param="branch" type="range" min="0.000" max="1.000" step="0.005" value="0.350">
  </div>
  <button id="playLoadButton" type="button">Play load</button>
  <button id="resetButton" type="button">Reset</button>
</section>
<div id="state">STARTING</div>
<script type="module">
const rootElement=document.documentElement;
const canvasElement=document.querySelector("#gpuCanvas");
const stateElement=document.querySelector("#state");
const ciMode=new URLSearchParams(location.search).get("ci")==="1";

const controls={
  mode:document.querySelector("#modeSelect"),
  opening:document.querySelector("#openingSlider"),
  length:document.querySelector("#lengthSlider"),
  danger:document.querySelector("#dangerSlider"),
  branch:document.querySelector("#branchSlider")
};
const loadSlider=document.querySelector("#loadSlider");
const loadValue=document.querySelector("#loadValue");
const playLoadButton=document.querySelector("#playLoadButton");
const outputs={
  mode:document.querySelector("#modeValue"),
  opening:document.querySelector("#openingValue"),
  length:document.querySelector("#lengthValue"),
  danger:document.querySelector("#dangerValue"),
  branch:document.querySelector("#branchValue")
};
const modeNames=["Hairline","Fissure","Impact","Network","Opening warp","Intact reference"];
const defaults={mode:1,opening:0.045,length:0.720,danger:0.780,branch:0.350};

function readParameters(){
  return {
    mode:Number(controls.mode.value),
    opening:Number(controls.opening.value),
    length:Number(controls.length.value),
    danger:Number(controls.danger.value),
    branch:Number(controls.branch.value)
  };
}
function updateOutputs(){
  const p=readParameters();
  loadValue.value=Number(loadSlider.value).toFixed(3);
  outputs.mode.value=modeNames[p.mode]||"Unknown";
  outputs.opening.value=p.opening.toFixed(3);
  outputs.length.value=p.length.toFixed(3);
  outputs.danger.value=p.danger.toFixed(3);
  outputs.branch.value=p.branch.toFixed(3);
}
function setStage(stageName){
  rootElement.dataset.webgpuStage=stageName;
  stateElement.textContent=stageName;
  console.log("[webgpu-stage]",stageName);
}
function failPage(errorValue){
  const message=String(errorValue && (errorValue.message||errorValue));
  rootElement.dataset.webgpuStatus="fail";
  rootElement.dataset.webgpuError=message;
  stateElement.textContent="FAIL: "+message;
  console.error("[webgpu-fail]",errorValue);
}
function clampUnit(value){
  return Math.max(0,Math.min(1,value));
}
function applyFractureLoad(loadInput){
  const loadAmount=clampUnit(Number(loadInput));
  loadSlider.value=loadAmount.toFixed(3);
  controls.danger.value=loadAmount.toFixed(3);
  controls.length.value=Math.min(1.0,0.05+0.95*loadAmount).toFixed(3);
  const openingPhase=clampUnit((loadAmount-0.25)/0.75);
  const openingAmount=0.002+0.108*Math.pow(openingPhase,1.6);
  controls.opening.value=openingAmount.toFixed(3);
  const branchAmount=clampUnit((loadAmount-0.52)/0.48);
  controls.branch.value=branchAmount.toFixed(3);
  updateOutputs();
}
updateOutputs();
setStage("script-start");

async function startDemo(){
  if(!navigator.gpu) throw new Error("navigator.gpu unavailable");
  setStage("request-adapter");
  const gpuAdapter=await navigator.gpu.requestAdapter({powerPreference:"high-performance"});
  if(!gpuAdapter) throw new Error("requestAdapter returned null");

  setStage("request-device");
  const gpuDevice=await gpuAdapter.requestDevice();
  gpuDevice.lost.then((lostInfo)=>{
    rootElement.dataset.webgpuDeviceLostReason=String(lostInfo.reason||"unknown");
    rootElement.dataset.webgpuDeviceLostMessage=String(lostInfo.message||"");
  });

  let gpuContext=null;
  const canvasFormat=ciMode?"rgba8unorm":navigator.gpu.getPreferredCanvasFormat();
  if(!ciMode){
    gpuContext=canvasElement.getContext("webgpu");
    if(!gpuContext) throw new Error("webgpu canvas context unavailable");
  }else{
    canvasElement.width=256;
    canvasElement.height=144;
  }

  const shaderSource=/* wgsl */ `
struct Params {
  viewport : vec4<f32>,
  crack : vec4<f32>,
  camera : vec4<f32>,
  extra : vec4<f32>,
};

@group(0) @binding(0) var<uniform> params : Params;

struct VertexOut {
  @builtin(position) position : vec4<f32>,
  @location(0) uv : vec2<f32>,
};

fn rotateY(pointPos : vec3<f32>, angleValue : f32) -> vec3<f32> {
  let cosValue = cos(angleValue);
  let sinValue = sin(angleValue);
  return vec3<f32>(
    cosValue * pointPos.x + sinValue * pointPos.z,
    pointPos.y,
    -sinValue * pointPos.x + cosValue * pointPos.z
  );
}

fn rotateX(pointPos : vec3<f32>, angleValue : f32) -> vec3<f32> {
  let cosValue = cos(angleValue);
  let sinValue = sin(angleValue);
  return vec3<f32>(
    pointPos.x,
    cosValue * pointPos.y - sinValue * pointPos.z,
    sinValue * pointPos.y + cosValue * pointPos.z
  );
}

fn sdSphere(pointPos : vec3<f32>, radiusValue : f32) -> f32 {
  return length(pointPos) - radiusValue;
}

fn crackHalfOpening(pointPos : vec3<f32>, startX : f32, frontX : f32, baseOpening : f32, dangerValue : f32) -> f32 {
  let crackExtent = max(frontX - startX, 0.001);
  let behindFront = clamp((frontX - pointPos.x) / crackExtent, 0.0, 1.0);
  let openingScale = sqrt(behindFront);
  let openingModulation = baseOpening * (0.18 + 0.82 * dangerValue);
  return max(0.0015, openingModulation * openingScale);
}

fn sdSlotSegment(pointPos : vec3<f32>, pointA : vec2<f32>, pointB : vec2<f32>, halfOpen : f32, depthBackZ : f32) -> f32 {
  let segmentDelta = pointB - pointA;
  let relativePos = pointPos.xy - pointA;
  let segmentScale = max(dot(segmentDelta, segmentDelta), 0.00001);
  let segmentT = clamp(dot(relativePos, segmentDelta) / segmentScale, 0.0, 1.0);
  let nearestPos = pointA + segmentDelta * segmentT;
  let planarDistance = length(pointPos.xy - nearestPos) - halfOpen;
  let depthDistance = depthBackZ - pointPos.z;
  return max(planarDistance, depthDistance);
}

fn sdPolylineCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, widthScale : f32, depthBaseZ : f32) -> f32 {
  let startX = -0.80;
  let crackExtent = 0.16 + clamp(lengthValue, 0.05, 1.0) * 1.25;
  let jaggedScale = 0.015 + 0.032 * dangerValue;

  let point0 = vec2<f32>(startX, -0.18 * jaggedScale);
  let point1 = vec2<f32>(startX + crackExtent * 0.23,  0.72 * jaggedScale);
  let point2 = vec2<f32>(startX + crackExtent * 0.47, -1.00 * jaggedScale);
  let point3 = vec2<f32>(startX + crackExtent * 0.72,  0.82 * jaggedScale);
  let point4 = vec2<f32>(startX + crackExtent,        -0.24 * jaggedScale);

  let baseOpen = max(0.0007, openingValue * widthScale * (0.22 + 0.78 * dangerValue));
  let depthBackZ = depthBaseZ - 0.24 * dangerValue;

  let segment0 = sdSlotSegment(pointPos, point0, point1, baseOpen * 0.95, depthBackZ);
  let segment1 = sdSlotSegment(pointPos, point1, point2, baseOpen * 0.76, depthBackZ + 0.02);
  let segment2 = sdSlotSegment(pointPos, point2, point3, baseOpen * 0.54, depthBackZ + 0.04);
  let segment3 = sdSlotSegment(pointPos, point3, point4, baseOpen * 0.24, depthBackZ + 0.06);

  return min(min(segment0, segment1), min(segment2, segment3));
}

fn sdMainCrackVoid(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32) -> f32 {
  return sdPolylineCrack(pointPos, openingValue, lengthValue, dangerValue, 1.0, 0.58);
}

fn sdBranchCrackVoid(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32, sideSign : f32) -> f32 {
  let branchWeight = clamp(branchValue * (0.30 + 0.70 * dangerValue), 0.0, 1.0);
  let startX = -0.80;
  let crackExtent = 0.16 + clamp(lengthValue, 0.05, 1.0) * 1.25;
  let jaggedScale = 0.015 + 0.032 * dangerValue;
  let branchStart = vec2<f32>(startX + crackExtent * 0.58, -0.40 * jaggedScale);
  let branchLength = crackExtent * (0.08 + 0.22 * branchWeight);
  let branchAngle = sideSign * (0.58 + 0.38 * branchWeight);
  let branchMid = branchStart + vec2<f32>(cos(branchAngle), sin(branchAngle)) * branchLength * 0.58;
  let branchTipAngle = branchAngle + sideSign * 0.22;
  let branchTip = branchMid + vec2<f32>(cos(branchTipAngle), sin(branchTipAngle)) * branchLength * 0.42;
  let branchOpen = max(0.0006, openingValue * branchWeight * 0.24);
  let branchDepth = 0.64 - 0.15 * dangerValue;

  let branchSegmentA = sdSlotSegment(pointPos, branchStart, branchMid, branchOpen, branchDepth);
  let branchSegmentB = sdSlotSegment(pointPos, branchMid, branchTip, branchOpen * 0.52, branchDepth + 0.03);
  return min(branchSegmentA, branchSegmentB);
}

fn sdCrackVoid(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32) -> f32 {
  var crackDistance = sdMainCrackVoid(pointPos, openingValue, lengthValue, dangerValue);
  if (branchValue > 0.001) {
    let branchA = sdBranchCrackVoid(pointPos, openingValue, lengthValue, dangerValue, branchValue, 1.0);
    let branchB = sdBranchCrackVoid(pointPos, openingValue, lengthValue, dangerValue, branchValue * 0.72, -1.0);
    crackDistance = min(crackDistance, min(branchA, branchB));
  }
  return crackDistance;
}

fn sdHairlineCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32) -> f32 {
  return sdPolylineCrack(pointPos, openingValue, lengthValue, dangerValue, 0.14, 0.76);
}

fn sdRadialCrack(pointPos : vec3<f32>, originXY : vec2<f32>, angleValue : f32, crackLength : f32, halfOpen : f32, depthBackZ : f32) -> f32 {
  let cosValue = cos(angleValue);
  let sinValue = sin(angleValue);
  let relativeXY = vec2<f32>(pointPos.x - originXY.x, pointPos.y - originXY.y);
  let lineU = cosValue * relativeXY.x + sinValue * relativeXY.y;
  let lineV = -sinValue * relativeXY.x + cosValue * relativeXY.y;
  let taperValue = sqrt(clamp(1.0 - lineU / max(crackLength, 0.001), 0.0, 1.0));
  let openingLimit = abs(lineV) - max(0.0007, halfOpen * taperValue);
  return max(max(-lineU, lineU - crackLength), max(openingLimit, depthBackZ - pointPos.z));
}

fn sdBentRadialCrack(pointPos : vec3<f32>, originXY : vec2<f32>, angleValue : f32, crackLength : f32, halfOpen : f32, depthBackZ : f32, bendValue : f32) -> f32 {
  let directionA = vec2<f32>(cos(angleValue), sin(angleValue));
  let middlePos = originXY + directionA * crackLength * 0.54;
  let directionB = vec2<f32>(cos(angleValue + bendValue), sin(angleValue + bendValue));
  let tipPos = middlePos + directionB * crackLength * 0.46;
  let firstSegment = sdSlotSegment(pointPos, originXY, middlePos, halfOpen, depthBackZ);
  let secondSegment = sdSlotSegment(pointPos, middlePos, tipPos, max(0.0006, halfOpen * 0.55), depthBackZ + 0.035);
  return min(firstSegment, secondSegment);
}

fn crackGuideY(pointX : f32, lengthValue : f32, dangerValue : f32) -> f32 {
  let startX = -0.80;
  let crackExtent = 0.16 + clamp(lengthValue, 0.05, 1.0) * 1.25;
  let guideT = clamp((pointX - startX) / max(crackExtent, 0.001), 0.0, 1.0);
  let jaggedScale = 0.015 + 0.032 * dangerValue;
  return jaggedScale * (
    0.60 * sin(guideT * 12.5663706 + 0.35) +
    0.34 * sin(guideT * 25.1327412 - 0.70)
  );
}

fn sdOpeningWarpBody(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32) -> f32 {
  let startX = -0.80;
  let crackExtent = 0.16 + clamp(lengthValue, 0.05, 1.0) * 1.25;
  let frontX = startX + crackExtent;
  let guideT = clamp((pointPos.x - startX) / max(crackExtent, 0.001), 0.0, 1.0);
  let withinX = select(0.0, 1.0, pointPos.x >= startX && pointPos.x <= frontX);
  let guideY = crackGuideY(pointPos.x, lengthValue, dangerValue);
  let sideDelta = pointPos.y - guideY;
  let sideDirection = select(-1.0, 1.0, sideDelta >= 0.0);
  let tipOpening = sqrt(clamp(1.0 - guideT, 0.0, 1.0));
  let lateralInfluence = exp(-abs(sideDelta) * 5.0);
  let lipInfluence = exp(-abs(sideDelta) * 17.0);
  let surfaceInfluence = clamp((pointPos.z - 0.08) / 0.72, 0.0, 1.0);
  let openingDisplacement = openingValue * (0.55 + 2.10 * dangerValue) * tipOpening *
                            lateralInfluence * surfaceInfluence * withinX;
  let lipLift = openingValue * (0.12 + 0.72 * dangerValue) * tipOpening *
                lipInfluence * surfaceInfluence * withinX;

  var inversePoint = pointPos;
  inversePoint.y = inversePoint.y - sideDirection * openingDisplacement;
  inversePoint.z = inversePoint.z - lipLift;
  return sdSphere(inversePoint, 0.86);
}

fn sdImpactCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32) -> f32 {
  let originXY = vec2<f32>(-0.12, 0.02);
  let baseLength = 0.18 + 0.56 * lengthValue;
  let halfOpen = max(0.0010, openingValue * (0.10 + 0.18 * dangerValue));
  let depthBackZ = 0.58 - 0.22 * dangerValue;

  let radialA = sdBentRadialCrack(pointPos, originXY, -0.10, baseLength * 1.00, halfOpen, depthBackZ,  0.18);
  let radialB = sdBentRadialCrack(pointPos, originXY,  0.58, baseLength * 0.83, halfOpen * 0.82, depthBackZ + 0.03, -0.24);
  let radialC = sdBentRadialCrack(pointPos, originXY,  1.36, baseLength * 0.68, halfOpen * 0.72, depthBackZ + 0.05,  0.31);
  let radialD = sdBentRadialCrack(pointPos, originXY, -0.86, baseLength * 0.76, halfOpen * 0.78, depthBackZ + 0.02, -0.27);
  var impactDistance = min(min(radialA, radialB), min(radialC, radialD));

  if (branchValue > 0.12) {
    let radialE = sdBentRadialCrack(pointPos, originXY, 2.42, baseLength * (0.38 + 0.30 * branchValue), halfOpen * 0.66, depthBackZ + 0.06, 0.29);
    impactDistance = min(impactDistance, radialE);
  }
  return impactDistance;
}

fn sdNetworkCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32) -> f32 {
  let primaryDistance = sdPolylineCrack(pointPos, openingValue, lengthValue, dangerValue, 0.38, 0.70);
  let secondaryOpen = max(0.0007, openingValue * 0.11);
  let secondaryDepth = 0.67 - 0.12 * dangerValue;
  let networkA = sdBentRadialCrack(pointPos, vec2<f32>(-0.32, 0.00),  0.78, 0.12 + 0.23 * lengthValue, secondaryOpen, secondaryDepth, 0.36);
  let networkB = sdBentRadialCrack(pointPos, vec2<f32>(-0.08,-0.01), -0.64, 0.10 + 0.20 * lengthValue, secondaryOpen * 0.88, secondaryDepth + 0.03, -0.32);
  let networkC = sdBentRadialCrack(pointPos, vec2<f32>( 0.08, 0.02),  0.28, 0.09 + 0.18 * lengthValue, secondaryOpen * 0.80, secondaryDepth + 0.02, 0.27);
  var networkDistance = min(primaryDistance, min(networkA, min(networkB, networkC)));
  if (branchValue > 0.18) {
    let networkD = sdBentRadialCrack(pointPos, vec2<f32>(-0.48,-0.01), -0.22, 0.08 + 0.20 * branchValue, secondaryOpen * 0.72, secondaryDepth + 0.04, -0.38);
    networkDistance = min(networkDistance, networkD);
  }
  return networkDistance;
}

fn crackVoidDistance(pointPos : vec3<f32>) -> f32 {
  let openingValue = params.crack.x;
  let lengthValue = params.crack.y;
  let dangerValue = params.crack.z;
  let branchValue = params.crack.w;
  let modeValue = params.extra.x;

  if (modeValue < 0.5) {
    return sdHairlineCrack(pointPos, openingValue, lengthValue, dangerValue);
  }
  if (modeValue < 1.5) {
    return sdCrackVoid(pointPos, openingValue, lengthValue, dangerValue, branchValue);
  }
  if (modeValue < 2.5) {
    return sdImpactCrack(pointPos, openingValue, lengthValue, dangerValue, branchValue);
  }
  if (modeValue < 3.5) {
    return sdNetworkCrack(pointPos, openingValue, lengthValue, dangerValue, branchValue);
  }
  if (modeValue < 4.5) {
    return sdCrackVoid(pointPos, openingValue * 0.30, lengthValue, dangerValue, branchValue * 0.65);
  }
  return 1000.0;
}

fn sceneDistance(pointPos : vec3<f32>) -> f32 {
  var bodyDistance = sdSphere(pointPos, 0.86);
  if (params.extra.x >= 3.5 && params.extra.x < 4.5) {
    bodyDistance = sdOpeningWarpBody(pointPos, params.crack.x, params.crack.y, params.crack.z);
  }
  let voidDistance = crackVoidDistance(pointPos);
  return max(bodyDistance, -voidDistance);
}

fn estimateNormal(pointPos : vec3<f32>) -> vec3<f32> {
  let epsilonValue = 0.0022;
  let axisX = vec3<f32>(epsilonValue,0.0,0.0);
  let axisY = vec3<f32>(0.0,epsilonValue,0.0);
  let axisZ = vec3<f32>(0.0,0.0,epsilonValue);
  return normalize(vec3<f32>(
    sceneDistance(pointPos+axisX)-sceneDistance(pointPos-axisX),
    sceneDistance(pointPos+axisY)-sceneDistance(pointPos-axisY),
    sceneDistance(pointPos+axisZ)-sceneDistance(pointPos-axisZ)
  ));
}

struct MarchResult {
  hitFlag : bool,
  travelValue : f32,
};

fn marchScene(rayOrigin : vec3<f32>, rayDirection : vec3<f32>) -> MarchResult {
  var travelValue = 0.0;
  var iterationIndex : i32 = 0;
  loop {
    if (iterationIndex >= 140 || travelValue > 8.0) { break; }
    let pointPos = rayOrigin + rayDirection * travelValue;
    let distanceValue = sceneDistance(pointPos);
    if (abs(distanceValue) < 0.0015) {
      return MarchResult(true, travelValue);
    }
    travelValue = travelValue + max(distanceValue * 0.70, 0.0025);
    iterationIndex = iterationIndex + 1;
  }
  return MarchResult(false, travelValue);
}

@vertex
fn vertexMain(@builtin(vertex_index) vertexIndex : u32) -> VertexOut {
  var positions = array<vec2<f32>,3>(
    vec2<f32>(-1.0,-3.0),
    vec2<f32>(3.0,1.0),
    vec2<f32>(-1.0,1.0)
  );
  let positionXY = positions[vertexIndex];
  var outputData : VertexOut;
  outputData.position = vec4<f32>(positionXY,0.0,1.0);
  outputData.uv = 0.5 * (positionXY + vec2<f32>(1.0,1.0));
  return outputData;
}

@fragment
fn fragmentMain(inputData : VertexOut) -> @location(0) vec4<f32> {
  let aspectValue = params.viewport.w;
  let ndcPos = vec2<f32>(
    (inputData.uv.x * 2.0 - 1.0) * aspectValue,
    -(inputData.uv.y * 2.0 - 1.0)
  );

  let yawValue = params.camera.x;
  let pitchValue = params.camera.y;
  let cameraDistance = params.camera.z;
  let rayOriginBase = vec3<f32>(0.0,0.0,cameraDistance);
  let rayOrigin = rotateY(rotateX(rayOriginBase,pitchValue),yawValue);
  let targetPos = vec3<f32>(0.0,0.0,0.0);
  let forwardDir = normalize(targetPos - rayOrigin);
  let worldUp = vec3<f32>(0.0,1.0,0.0);
  let rightDir = normalize(cross(forwardDir,worldUp));
  let upDir = normalize(cross(rightDir,forwardDir));
  let rayDirection = normalize(forwardDir*1.65 + rightDir*ndcPos.x + upDir*ndcPos.y);

  var colorValue = vec3<f32>(0.02,0.04,0.08);
  let marchResult = marchScene(rayOrigin,rayDirection);
  if (marchResult.hitFlag) {
    let pointPos = rayOrigin + rayDirection * marchResult.travelValue;
    let normalValue = estimateNormal(pointPos);
    let lightDir = normalize(vec3<f32>(0.8,1.2,0.6));
    let diffuseValue = max(dot(normalValue,lightDir),0.0);
    let viewFacing = max(dot(normalValue,-rayDirection),0.0);
    let rimValue = pow(1.0-viewFacing,2.6);
    let voidDistance = crackVoidDistance(pointPos);
    var crackFalloff = 42.0;
    var crackShadeStrength = 0.72;
    if (params.extra.x < 0.5) {
      crackFalloff = 8.0;
      crackShadeStrength = 0.22;
    } else if (params.extra.x >= 3.5) {
      crackFalloff = 28.0;
      crackShadeStrength = 0.62;
    }
    let crackSurfaceFactor = exp(-abs(voidDistance)*crackFalloff);
    let baseColor = vec3<f32>(0.30,0.56,0.88);
    let interiorColor = vec3<f32>(0.025,0.032,0.045);
    colorValue = baseColor * (0.16 + 0.84 * diffuseValue);
    colorValue = mix(colorValue, interiorColor, clamp(crackSurfaceFactor * crackShadeStrength, 0.0, crackShadeStrength));
    colorValue = colorValue + vec3<f32>(0.16,0.18,0.22) * rimValue;
  }
  return vec4<f32>(colorValue,1.0);
}
`;

  setStage("shader-module");
  const shaderModule=gpuDevice.createShaderModule({code:shaderSource});
  setStage("shader-compilation-info");
  const compilationInfo=await shaderModule.getCompilationInfo();
  const shaderErrors=compilationInfo.messages.filter(entry=>entry.type==="error");
  if(shaderErrors.length) throw new Error(shaderErrors.map(entry=>entry.message).join(" | "));

  const uniformArray=new Float32Array(16);
  const uniformBuffer=gpuDevice.createBuffer({
    size:uniformArray.byteLength,
    usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST
  });
  const bindLayout=gpuDevice.createBindGroupLayout({
    entries:[{binding:0,visibility:GPUShaderStage.FRAGMENT,buffer:{type:"uniform"}}]
  });
  const bindGroup=gpuDevice.createBindGroup({
    layout:bindLayout,
    entries:[{binding:0,resource:{buffer:uniformBuffer}}]
  });

  gpuDevice.pushErrorScope("validation");
  setStage("create-pipeline");
  const renderPipeline=gpuDevice.createRenderPipeline({
    layout:gpuDevice.createPipelineLayout({bindGroupLayouts:[bindLayout]}),
    vertex:{module:shaderModule,entryPoint:"vertexMain"},
    fragment:{module:shaderModule,entryPoint:"fragmentMain",targets:[{format:canvasFormat}]},
    primitive:{topology:"triangle-list"}
  });

  let renderTexture=null;
  let readBuffer=null;

  function resizeCanvas(){
    if(ciMode) return;
    const ratio=Math.min(window.devicePixelRatio||1,2);
    const widthValue=Math.max(1,Math.floor(canvasElement.clientWidth*ratio));
    const heightValue=Math.max(1,Math.floor(canvasElement.clientHeight*ratio));
    if(canvasElement.width!==widthValue||canvasElement.height!==heightValue){
      canvasElement.width=widthValue;
      canvasElement.height=heightValue;
      gpuContext.configure({device:gpuDevice,format:canvasFormat,alphaMode:"opaque"});
    }
  }
  if(!ciMode){
    resizeCanvas();
    window.addEventListener("resize",()=>{resizeCanvas();renderCurrent();});
  }else{
    renderTexture=gpuDevice.createTexture({
      size:[canvasElement.width,canvasElement.height,1],
      format:canvasFormat,
      usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC
    });
    readBuffer=gpuDevice.createBuffer({
      size:canvasElement.width*4*canvasElement.height,
      usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ
    });
  }

  const cameraState={yaw:0.15,pitch:-0.10,distance:2.45,dragging:false,lastX:0,lastY:0};

  function publishCameraState(){
    rootElement.dataset.cameraState=JSON.stringify({
      yaw:cameraState.yaw,
      pitch:cameraState.pitch,
      distance:cameraState.distance
    });
  }

  function renderCurrent(){
    const p=readParameters();
    updateOutputs();
    uniformArray.fill(0);
    uniformArray[0]=canvasElement.width;
    uniformArray[1]=canvasElement.height;
    uniformArray[3]=canvasElement.width/Math.max(canvasElement.height,1);
    uniformArray[4]=p.opening;
    uniformArray[5]=p.length;
    uniformArray[6]=p.danger;
    uniformArray[7]=p.branch;
    uniformArray[8]=cameraState.yaw;
    uniformArray[9]=cameraState.pitch;
    uniformArray[10]=cameraState.distance;
    uniformArray[12]=p.mode;
    publishCameraState();
    gpuDevice.queue.writeBuffer(uniformBuffer,0,uniformArray);

    const commandEncoder=gpuDevice.createCommandEncoder();
    const renderView=ciMode?renderTexture.createView():gpuContext.getCurrentTexture().createView();
    const renderPass=commandEncoder.beginRenderPass({
      colorAttachments:[{
        view:renderView,
        clearValue:{r:0.02,g:0.04,b:0.08,a:1},
        loadOp:"clear",
        storeOp:"store"
      }]
    });
    renderPass.setPipeline(renderPipeline);
    renderPass.setBindGroup(0,bindGroup);
    renderPass.draw(3,1,0,0);
    renderPass.end();
    if(ciMode){
      commandEncoder.copyTextureToBuffer(
        {texture:renderTexture},
        {buffer:readBuffer,bytesPerRow:canvasElement.width*4,rowsPerImage:canvasElement.height},
        [canvasElement.width,canvasElement.height,1]
      );
    }
    gpuDevice.queue.submit([commandEncoder.finish()]);
    const nextRevision=Number(rootElement.dataset.renderRevision||"0")+1;
    rootElement.dataset.renderRevision=String(nextRevision);
    rootElement.dataset.currentParameters=JSON.stringify(p);
  }

  let renderScheduled=false;
  function scheduleRender(){
    if(renderScheduled) return;
    renderScheduled=true;
    requestAnimationFrame(()=>{
      renderScheduled=false;
      renderCurrent();
    });
  }
  for(const controlElement of Object.values(controls)){
    controlElement.addEventListener("input",scheduleRender);
    controlElement.addEventListener("change",scheduleRender);
  }

  let loadAnimationFrame=0;
  let loadAnimationStart=0;
  function stopLoadAnimation(){
    if(loadAnimationFrame){
      cancelAnimationFrame(loadAnimationFrame);
      loadAnimationFrame=0;
    }
    playLoadButton.textContent="Play load";
  }
  function runLoadAnimation(frameTime){
    if(!loadAnimationStart) loadAnimationStart=frameTime;
    const elapsedSeconds=(frameTime-loadAnimationStart)/1000;
    const loadAmount=Math.min(1,elapsedSeconds/4.0);
    applyFractureLoad(loadAmount);
    renderCurrent();
    if(loadAmount<1){
      loadAnimationFrame=requestAnimationFrame(runLoadAnimation);
    }else{
      loadAnimationFrame=0;
      loadAnimationStart=0;
      playLoadButton.textContent="Replay load";
    }
  }
  loadSlider.addEventListener("input",()=>{
    stopLoadAnimation();
    applyFractureLoad(loadSlider.value);
    scheduleRender();
  });
  playLoadButton.addEventListener("click",()=>{
    stopLoadAnimation();
    loadAnimationStart=0;
    applyFractureLoad(0);
    renderCurrent();
    playLoadButton.textContent="Playing…";
    loadAnimationFrame=requestAnimationFrame(runLoadAnimation);
  });

  canvasElement.addEventListener("pointerdown",(eventValue)=>{
    cameraState.dragging=true;
    cameraState.lastX=eventValue.clientX;
    cameraState.lastY=eventValue.clientY;
    try{canvasElement.setPointerCapture(eventValue.pointerId);}catch{}
  });
  canvasElement.addEventListener("pointermove",(eventValue)=>{
    if(!cameraState.dragging) return;
    const deltaX=eventValue.clientX-cameraState.lastX;
    const deltaY=eventValue.clientY-cameraState.lastY;
    cameraState.lastX=eventValue.clientX;
    cameraState.lastY=eventValue.clientY;
    cameraState.yaw+=deltaX*0.010;
    cameraState.pitch=Math.max(-1.25,Math.min(1.25,cameraState.pitch+deltaY*0.010));
    scheduleRender();
  });
  function finishPointerDrag(){cameraState.dragging=false;}
  canvasElement.addEventListener("pointerup",finishPointerDrag);
  canvasElement.addEventListener("pointercancel",finishPointerDrag);
  canvasElement.addEventListener("wheel",(eventValue)=>{
    eventValue.preventDefault();
    cameraState.distance=Math.max(1.35,Math.min(5.0,cameraState.distance*Math.exp(eventValue.deltaY*0.001)));
    scheduleRender();
  },{passive:false});

  document.querySelector("#resetButton").addEventListener("click",()=>{
    stopLoadAnimation();
    loadSlider.value="0.700";
    for(const [key,value] of Object.entries(defaults)) controls[key].value=String(value);
    cameraState.yaw=0.15;
    cameraState.pitch=-0.10;
    cameraState.distance=2.45;
    updateOutputs();
    scheduleRender();
  });

  setStage("first-submit");
  renderCurrent();

  setStage("validation-scope");
  const validationError=await gpuDevice.popErrorScope();
  if(validationError) throw new Error("WebGPU validation: "+validationError.message);

  async function mirrorCiTextureToCanvas(){
    if(!ciMode) return {visiblePixelCount:0,dataUrl:""};
    await gpuDevice.queue.onSubmittedWorkDone();
    await readBuffer.mapAsync(GPUMapMode.READ);
    const pixelBytes=new Uint8Array(readBuffer.getMappedRange());
    let visiblePixelCount=0;
    for(let offset=0;offset<pixelBytes.length;offset+=4){
      if(pixelBytes[offset]>20 || pixelBytes[offset+1]>25 || pixelBytes[offset+2]>40) visiblePixelCount++;
    }
    const previewBytes=new Uint8ClampedArray(pixelBytes.slice());
    readBuffer.unmap();
    const previewContext=canvasElement.getContext("2d");
    if(previewContext){
      const previewImage=new ImageData(previewBytes,canvasElement.width,canvasElement.height);
      previewContext.putImageData(previewImage,0,0);
    }
    rootElement.dataset.visiblePixelCount=String(visiblePixelCount);
    rootElement.dataset.previewReady="1";
    return {visiblePixelCount,dataUrl:canvasElement.toDataURL("image/png")};
  }

  if(ciMode){
    window.__sdfCaptureMode=async(modeValue,cameraYaw=0.0,cameraPitch=-0.05,cameraDistance=2.45)=>{
      for(const [key,value] of Object.entries(defaults)){
        controls[key].value=String(value);
      }
      controls.mode.value=String(modeValue);
      cameraState.yaw=Number(cameraYaw);
      cameraState.pitch=Number(cameraPitch);
      cameraState.distance=Number(cameraDistance);
      updateOutputs();
      renderCurrent();
      const captureResult=await mirrorCiTextureToCanvas();
      return {
        mode:Number(modeValue),
        modeName:modeNames[Number(modeValue)]||"Unknown",
        camera:{yaw:cameraState.yaw,pitch:cameraState.pitch,distance:cameraState.distance},
        parameters:readParameters(),
        visiblePixelCount:captureResult.visiblePixelCount,
        dataUrl:captureResult.dataUrl
      };
    };
  }

  setStage("submitted-work-wait");
  await gpuDevice.queue.onSubmittedWorkDone();

  if(ciMode){
    setStage("pixel-readback");
    const initialCapture=await mirrorCiTextureToCanvas();
    if(initialCapture.visiblePixelCount<200) throw new Error("render completed but geometry was not visibly different from background; visiblePixelCount="+initialCapture.visiblePixelCount);
  }

  setStage("done");
  rootElement.dataset.webgpuStatus="ok";
  stateElement.textContent="OK / WebGPU SDF crack / render #"+rootElement.dataset.renderRevision;
}

startDemo().catch(failPage);
</script>
</body>
</html>
