<!doctype html>
<html lang="en" data-webgpu-status="starting"><head><meta charset="utf-8"><title>SDF crack behavior regression</title>
<style>html,body{margin:0;background:#08101b;color:#eef;font:12px ui-monospace,monospace}pre{padding:12px;white-space:pre-wrap}</style></head>
<body><pre id="state">starting</pre><script type="module">
const rootElement=document.documentElement;
const stateElement=document.querySelector("#state");
function stage(stageName){rootElement.dataset.webgpuStage=stageName;stateElement.textContent=stageName;}
function fail(errorValue){
  const message=String(errorValue?.message||errorValue);
  rootElement.dataset.webgpuStatus="fail";
  rootElement.dataset.webgpuError=message;
  stateElement.textContent="FAIL\n"+message;
  console.error(errorValue);
}
const shaderSource=/* wgsl */ `
struct Params {
  viewport : vec4<f32>,
  crack : vec4<f32>,
  camera : vec4<f32>,
  extra : vec4<f32>,
};

@group(0) @binding(0) var<uniform> params : Params;

struct VertexOut {
  @builtin(position) position : vec4<f32>,
  @location(0) uv : vec2<f32>,
};

fn rotateY(pointPos : vec3<f32>, angleValue : f32) -> vec3<f32> {
  let cosValue = cos(angleValue);
  let sinValue = sin(angleValue);
  return vec3<f32>(
    cosValue * pointPos.x + sinValue * pointPos.z,
    pointPos.y,
    -sinValue * pointPos.x + cosValue * pointPos.z
  );
}

fn rotateX(pointPos : vec3<f32>, angleValue : f32) -> vec3<f32> {
  let cosValue = cos(angleValue);
  let sinValue = sin(angleValue);
  return vec3<f32>(
    pointPos.x,
    cosValue * pointPos.y - sinValue * pointPos.z,
    sinValue * pointPos.y + cosValue * pointPos.z
  );
}

fn sdSphere(pointPos : vec3<f32>, radiusValue : f32) -> f32 {
  return length(pointPos) - radiusValue;
}

fn crackHalfOpening(pointPos : vec3<f32>, startX : f32, frontX : f32, baseOpening : f32, dangerValue : f32) -> f32 {
  let crackExtent = max(frontX - startX, 0.001);
  let behindFront = clamp((frontX - pointPos.x) / crackExtent, 0.0, 1.0);
  let openingScale = sqrt(behindFront);
  let openingModulation = baseOpening * (0.18 + 0.82 * dangerValue);
  return max(0.0015, openingModulation * openingScale);
}

fn sdSlotSegment(pointPos : vec3<f32>, pointA : vec2<f32>, pointB : vec2<f32>, halfOpen : f32, depthBackZ : f32) -> f32 {
  let segmentDelta = pointB - pointA;
  let relativePos = pointPos.xy - pointA;
  let segmentScale = max(dot(segmentDelta, segmentDelta), 0.00001);
  let segmentT = clamp(dot(relativePos, segmentDelta) / segmentScale, 0.0, 1.0);
  let nearestPos = pointA + segmentDelta * segmentT;
  let planarDistance = length(pointPos.xy - nearestPos) - halfOpen;
  let depthDistance = depthBackZ - pointPos.z;
  return max(planarDistance, depthDistance);
}

fn sdPolylineCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, widthScale : f32, depthBaseZ : f32) -> f32 {
  let startX = -0.80;
  let crackExtent = 0.16 + clamp(lengthValue, 0.05, 1.0) * 1.25;
  let jaggedScale = 0.015 + 0.032 * dangerValue;

  let point0 = vec2<f32>(startX, -0.18 * jaggedScale);
  let point1 = vec2<f32>(startX + crackExtent * 0.23,  0.72 * jaggedScale);
  let point2 = vec2<f32>(startX + crackExtent * 0.47, -1.00 * jaggedScale);
  let point3 = vec2<f32>(startX + crackExtent * 0.72,  0.82 * jaggedScale);
  let point4 = vec2<f32>(startX + crackExtent,        -0.24 * jaggedScale);

  let baseOpen = max(0.0007, openingValue * widthScale * (0.22 + 0.78 * dangerValue));
  let depthBackZ = depthBaseZ - 0.24 * dangerValue;

  let segment0 = sdSlotSegment(pointPos, point0, point1, baseOpen * 0.95, depthBackZ);
  let segment1 = sdSlotSegment(pointPos, point1, point2, baseOpen * 0.76, depthBackZ + 0.02);
  let segment2 = sdSlotSegment(pointPos, point2, point3, baseOpen * 0.54, depthBackZ + 0.04);
  let segment3 = sdSlotSegment(pointPos, point3, point4, baseOpen * 0.24, depthBackZ + 0.06);

  return min(min(segment0, segment1), min(segment2, segment3));
}

fn sdMainCrackVoid(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32) -> f32 {
  return sdPolylineCrack(pointPos, openingValue, lengthValue, dangerValue, 1.0, 0.58);
}

fn sdBranchCrackVoid(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32, sideSign : f32) -> f32 {
  let branchWeight = clamp(branchValue * (0.30 + 0.70 * dangerValue), 0.0, 1.0);
  let startX = -0.80;
  let crackExtent = 0.16 + clamp(lengthValue, 0.05, 1.0) * 1.25;
  let jaggedScale = 0.015 + 0.032 * dangerValue;
  let branchStart = vec2<f32>(startX + crackExtent * 0.58, -0.40 * jaggedScale);
  let branchLength = crackExtent * (0.08 + 0.22 * branchWeight);
  let branchAngle = sideSign * (0.58 + 0.38 * branchWeight);
  let branchMid = branchStart + vec2<f32>(cos(branchAngle), sin(branchAngle)) * branchLength * 0.58;
  let branchTipAngle = branchAngle + sideSign * 0.22;
  let branchTip = branchMid + vec2<f32>(cos(branchTipAngle), sin(branchTipAngle)) * branchLength * 0.42;
  let branchOpen = max(0.0006, openingValue * branchWeight * 0.24);
  let branchDepth = 0.64 - 0.15 * dangerValue;

  let branchSegmentA = sdSlotSegment(pointPos, branchStart, branchMid, branchOpen, branchDepth);
  let branchSegmentB = sdSlotSegment(pointPos, branchMid, branchTip, branchOpen * 0.52, branchDepth + 0.03);
  return min(branchSegmentA, branchSegmentB);
}

fn sdCrackVoid(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32) -> f32 {
  var crackDistance = sdMainCrackVoid(pointPos, openingValue, lengthValue, dangerValue);
  if (branchValue > 0.001) {
    let branchA = sdBranchCrackVoid(pointPos, openingValue, lengthValue, dangerValue, branchValue, 1.0);
    let branchB = sdBranchCrackVoid(pointPos, openingValue, lengthValue, dangerValue, branchValue * 0.72, -1.0);
    crackDistance = min(crackDistance, min(branchA, branchB));
  }
  return crackDistance;
}

fn sdHairlineCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32) -> f32 {
  return sdPolylineCrack(pointPos, openingValue, lengthValue, dangerValue, 0.14, 0.76);
}

fn sdRadialCrack(pointPos : vec3<f32>, originXY : vec2<f32>, angleValue : f32, crackLength : f32, halfOpen : f32, depthBackZ : f32) -> f32 {
  let cosValue = cos(angleValue);
  let sinValue = sin(angleValue);
  let relativeXY = vec2<f32>(pointPos.x - originXY.x, pointPos.y - originXY.y);
  let lineU = cosValue * relativeXY.x + sinValue * relativeXY.y;
  let lineV = -sinValue * relativeXY.x + cosValue * relativeXY.y;
  let taperValue = sqrt(clamp(1.0 - lineU / max(crackLength, 0.001), 0.0, 1.0));
  let openingLimit = abs(lineV) - max(0.0007, halfOpen * taperValue);
  return max(max(-lineU, lineU - crackLength), max(openingLimit, depthBackZ - pointPos.z));
}

fn sdImpactCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32) -> f32 {
  let originXY = vec2<f32>(-0.12, 0.02);
  let baseLength = 0.18 + 0.56 * lengthValue;
  let halfOpen = max(0.0010, openingValue * (0.10 + 0.18 * dangerValue));
  let depthBackZ = 0.58 - 0.22 * dangerValue;

  let radialA = sdRadialCrack(pointPos, originXY, -0.10, baseLength * 1.00, halfOpen, depthBackZ);
  let radialB = sdRadialCrack(pointPos, originXY,  0.58, baseLength * 0.83, halfOpen * 0.82, depthBackZ + 0.03);
  let radialC = sdRadialCrack(pointPos, originXY,  1.36, baseLength * 0.68, halfOpen * 0.72, depthBackZ + 0.05);
  let radialD = sdRadialCrack(pointPos, originXY, -0.86, baseLength * 0.76, halfOpen * 0.78, depthBackZ + 0.02);
  var impactDistance = min(min(radialA, radialB), min(radialC, radialD));

  if (branchValue > 0.12) {
    let radialE = sdRadialCrack(pointPos, originXY, 2.42, baseLength * (0.38 + 0.30 * branchValue), halfOpen * 0.66, depthBackZ + 0.06);
    impactDistance = min(impactDistance, radialE);
  }
  return impactDistance;
}

fn sdNetworkCrack(pointPos : vec3<f32>, openingValue : f32, lengthValue : f32, dangerValue : f32, branchValue : f32) -> f32 {
  let primaryDistance = sdPolylineCrack(pointPos, openingValue, lengthValue, dangerValue, 0.38, 0.70);
  let secondaryOpen = max(0.0007, openingValue * 0.11);
  let secondaryDepth = 0.67 - 0.12 * dangerValue;
  let networkA = sdRadialCrack(pointPos, vec2<f32>(-0.32, 0.00),  0.78, 0.12 + 0.23 * lengthValue, secondaryOpen, secondaryDepth);
  let networkB = sdRadialCrack(pointPos, vec2<f32>(-0.08,-0.01), -0.64, 0.10 + 0.20 * lengthValue, secondaryOpen * 0.88, secondaryDepth + 0.03);
  let networkC = sdRadialCrack(pointPos, vec2<f32>( 0.08, 0.02),  0.28, 0.09 + 0.18 * lengthValue, secondaryOpen * 0.80, secondaryDepth + 0.02);
  var networkDistance = min(primaryDistance, min(networkA, min(networkB, networkC)));
  if (branchValue > 0.18) {
    let networkD = sdRadialCrack(pointPos, vec2<f32>(-0.48,-0.01), -0.22, 0.08 + 0.20 * branchValue, secondaryOpen * 0.72, secondaryDepth + 0.04);
    networkDistance = min(networkDistance, networkD);
  }
  return networkDistance;
}

fn crackVoidDistance(pointPos : vec3<f32>) -> f32 {
  let openingValue = params.crack.x;
  let lengthValue = params.crack.y;
  let dangerValue = params.crack.z;
  let branchValue = params.crack.w;
  let modeValue = params.extra.x;

  if (modeValue < 0.5) {
    return sdHairlineCrack(pointPos, openingValue, lengthValue, dangerValue);
  }
  if (modeValue < 1.5) {
    return sdCrackVoid(pointPos, openingValue, lengthValue, dangerValue, branchValue);
  }
  if (modeValue < 2.5) {
    return sdImpactCrack(pointPos, openingValue, lengthValue, dangerValue, branchValue);
  }
  return sdNetworkCrack(pointPos, openingValue, lengthValue, dangerValue, branchValue);
}

fn sceneDistance(pointPos : vec3<f32>) -> f32 {
  let bodyDistance = sdSphere(pointPos, 0.86);
  let voidDistance = crackVoidDistance(pointPos);
  return max(bodyDistance, -voidDistance);
}

fn estimateNormal(pointPos : vec3<f32>) -> vec3<f32> {
  let epsilonValue = 0.0022;
  let axisX = vec3<f32>(epsilonValue,0.0,0.0);
  let axisY = vec3<f32>(0.0,epsilonValue,0.0);
  let axisZ = vec3<f32>(0.0,0.0,epsilonValue);
  return normalize(vec3<f32>(
    sceneDistance(pointPos+axisX)-sceneDistance(pointPos-axisX),
    sceneDistance(pointPos+axisY)-sceneDistance(pointPos-axisY),
    sceneDistance(pointPos+axisZ)-sceneDistance(pointPos-axisZ)
  ));
}

struct MarchResult {
  hitFlag : bool,
  travelValue : f32,
};

fn marchScene(rayOrigin : vec3<f32>, rayDirection : vec3<f32>) -> MarchResult {
  var travelValue = 0.0;
  var iterationIndex : i32 = 0;
  loop {
    if (iterationIndex >= 140 || travelValue > 8.0) { break; }
    let pointPos = rayOrigin + rayDirection * travelValue;
    let distanceValue = sceneDistance(pointPos);
    if (abs(distanceValue) < 0.0015) {
      return MarchResult(true, travelValue);
    }
    travelValue = travelValue + max(distanceValue * 0.70, 0.0025);
    iterationIndex = iterationIndex + 1;
  }
  return MarchResult(false, travelValue);
}

@vertex
fn vertexMain(@builtin(vertex_index) vertexIndex : u32) -> VertexOut {
  var positions = array<vec2<f32>,3>(
    vec2<f32>(-1.0,-3.0),
    vec2<f32>(3.0,1.0),
    vec2<f32>(-1.0,1.0)
  );
  let positionXY = positions[vertexIndex];
  var outputData : VertexOut;
  outputData.position = vec4<f32>(positionXY,0.0,1.0);
  outputData.uv = 0.5 * (positionXY + vec2<f32>(1.0,1.0));
  return outputData;
}

@fragment
fn fragmentMain(inputData : VertexOut) -> @location(0) vec4<f32> {
  let aspectValue = params.viewport.w;
  let ndcPos = vec2<f32>(
    (inputData.uv.x * 2.0 - 1.0) * aspectValue,
    -(inputData.uv.y * 2.0 - 1.0)
  );

  let yawValue = params.camera.x;
  let pitchValue = params.camera.y;
  let cameraDistance = params.camera.z;
  let rayOriginBase = vec3<f32>(0.0,0.0,cameraDistance);
  let rayOrigin = rotateY(rotateX(rayOriginBase,pitchValue),yawValue);
  let targetPos = vec3<f32>(0.0,0.0,0.0);
  let forwardDir = normalize(targetPos - rayOrigin);
  let worldUp = vec3<f32>(0.0,1.0,0.0);
  let rightDir = normalize(cross(forwardDir,worldUp));
  let upDir = normalize(cross(rightDir,forwardDir));
  let rayDirection = normalize(forwardDir*1.65 + rightDir*ndcPos.x + upDir*ndcPos.y);

  var colorValue = vec3<f32>(0.02,0.04,0.08);
  let marchResult = marchScene(rayOrigin,rayDirection);
  if (marchResult.hitFlag) {
    let pointPos = rayOrigin + rayDirection * marchResult.travelValue;
    let normalValue = estimateNormal(pointPos);
    let lightDir = normalize(vec3<f32>(0.8,1.2,0.6));
    let diffuseValue = max(dot(normalValue,lightDir),0.0);
    let viewFacing = max(dot(normalValue,-rayDirection),0.0);
    let rimValue = pow(1.0-viewFacing,2.6);
    let voidDistance = crackVoidDistance(pointPos);
    let crackSurfaceFactor = exp(-abs(voidDistance)*42.0);
    let baseColor = vec3<f32>(0.30,0.56,0.88);
    let interiorColor = vec3<f32>(0.025,0.032,0.045);
    colorValue = baseColor * (0.16 + 0.84 * diffuseValue);
    colorValue = mix(colorValue, interiorColor, clamp(crackSurfaceFactor * 0.72, 0.0, 0.72));
    colorValue = colorValue + vec3<f32>(0.16,0.18,0.22) * rimValue;
  }
  return vec4<f32>(colorValue,1.0);
}
`;

async function main(){
  stage("request-adapter");
  if(!navigator.gpu) throw new Error("navigator.gpu unavailable");
  const gpuAdapter=await navigator.gpu.requestAdapter({powerPreference:"high-performance"});
  if(!gpuAdapter) throw new Error("requestAdapter returned null");
  stage("request-device");
  const gpuDevice=await gpuAdapter.requestDevice();

  stage("shader-compilation-info");
  const shaderModule=gpuDevice.createShaderModule({code:shaderSource});
  const compilationInfo=await shaderModule.getCompilationInfo();
  const shaderErrors=compilationInfo.messages.filter(entry=>entry.type==="error");
  if(shaderErrors.length) throw new Error(shaderErrors.map(entry=>entry.message).join(" | "));

  const width=256,height=144,format="rgba8unorm",bytesPerRow=width*4;
  const uniformArray=new Float32Array(16);
  const uniformBuffer=gpuDevice.createBuffer({size:uniformArray.byteLength,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  const bindLayout=gpuDevice.createBindGroupLayout({entries:[{binding:0,visibility:GPUShaderStage.FRAGMENT,buffer:{type:"uniform"}}]});
  const bindGroup=gpuDevice.createBindGroup({layout:bindLayout,entries:[{binding:0,resource:{buffer:uniformBuffer}}]});

  gpuDevice.pushErrorScope("validation");
  stage("create-pipeline");
  const renderPipeline=gpuDevice.createRenderPipeline({
    layout:gpuDevice.createPipelineLayout({bindGroupLayouts:[bindLayout]}),
    vertex:{module:shaderModule,entryPoint:"vertexMain"},
    fragment:{module:shaderModule,entryPoint:"fragmentMain",targets:[{format}]},
    primitive:{topology:"triangle-list"}
  });
  const renderTexture=gpuDevice.createTexture({size:[width,height,1],format,usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});

  async function renderCase(caseName,values){
    stage("render-"+caseName);
    uniformArray.fill(0);
    uniformArray[0]=width; uniformArray[1]=height; uniformArray[3]=width/height;
    uniformArray[4]=values.opening; uniformArray[5]=values.length; uniformArray[6]=values.danger; uniformArray[7]=values.branch;
    uniformArray[8]=values.yaw??0.15; uniformArray[9]=values.pitch??-0.10; uniformArray[10]=values.distance??2.45;
    uniformArray[12]=values.mode??1;
    gpuDevice.queue.writeBuffer(uniformBuffer,0,uniformArray);

    const readBuffer=gpuDevice.createBuffer({size:bytesPerRow*height,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    const commandEncoder=gpuDevice.createCommandEncoder();
    const renderPass=commandEncoder.beginRenderPass({colorAttachments:[{
      view:renderTexture.createView(),clearValue:{r:0.02,g:0.04,b:0.08,a:1},loadOp:"clear",storeOp:"store"
    }]});
    renderPass.setPipeline(renderPipeline); renderPass.setBindGroup(0,bindGroup); renderPass.draw(3,1,0,0); renderPass.end();
    commandEncoder.copyTextureToBuffer({texture:renderTexture},{buffer:readBuffer,bytesPerRow,rowsPerImage:height},[width,height,1]);
    gpuDevice.queue.submit([commandEncoder.finish()]);
    await gpuDevice.queue.onSubmittedWorkDone();
    await readBuffer.mapAsync(GPUMapMode.READ);
    const copyBytes=new Uint8Array(readBuffer.getMappedRange()).slice();
    readBuffer.unmap(); readBuffer.destroy();
    return copyBytes;
  }

  function visiblePixelCount(bytes){
    let count=0;
    for(let index=0;index<bytes.length;index+=4){
      if(bytes[index]>20||bytes[index+1]>25||bytes[index+2]>40) count++;
    }
    return count;
  }
  function compareImages(firstBytes,secondBytes){
    let changedPixels=0,absoluteDelta=0,maxPixelDelta=0;
    for(let index=0;index<firstBytes.length;index+=4){
      const pixelDelta=Math.abs(firstBytes[index]-secondBytes[index])+Math.abs(firstBytes[index+1]-secondBytes[index+1])+Math.abs(firstBytes[index+2]-secondBytes[index+2]);
      absoluteDelta+=pixelDelta;
      if(pixelDelta>=8) changedPixels++;
      if(pixelDelta>maxPixelDelta) maxPixelDelta=pixelDelta;
    }
    return {changedPixels,meanAbsChannelDelta:absoluteDelta/(width*height*3),maxPixelDelta};
  }

  const base={opening:0.045,length:0.72,danger:0.78,branch:0.35,yaw:0.15,pitch:-0.10,distance:2.45};
  const cases={
    fissure:{...base,mode:1},
    openingLow:{...base,mode:1,opening:0.005},
    openingHigh:{...base,mode:1,opening:0.100},
    lengthLow:{...base,mode:1,length:0.20},
    lengthHigh:{...base,mode:1,length:0.98},
    dangerLow:{...base,mode:1,danger:0.00},
    dangerHigh:{...base,mode:1,danger:1.00},
    branchOff:{...base,mode:1,branch:0.00},
    branchOn:{...base,mode:1,branch:1.00},
    hairline:{...base,mode:0},
    impact:{...base,mode:2},
    network:{...base,mode:3},
    cameraRotated:{...base,mode:1,yaw:0.72,pitch:0.28},
    cameraZoomed:{...base,mode:1,distance:1.80}
  };
  const images={},visible={};
  for(const [caseName,values] of Object.entries(cases)){
    images[caseName]=await renderCase(caseName,values);
    visible[caseName]=visiblePixelCount(images[caseName]);
  }

  const comparisons={
    opening:compareImages(images.openingLow,images.openingHigh),
    length:compareImages(images.lengthLow,images.lengthHigh),
    danger:compareImages(images.dangerLow,images.dangerHigh),
    branch:compareImages(images.branchOff,images.branchOn),
    hairlineVsFissure:compareImages(images.hairline,images.fissure),
    fissureVsImpact:compareImages(images.fissure,images.impact),
    impactVsNetwork:compareImages(images.impact,images.network),
    cameraRotation:compareImages(images.fissure,images.cameraRotated),
    cameraZoom:compareImages(images.fissure,images.cameraZoomed)
  };

  const assertions=[];
  function check(assertName,condition,details){assertions.push({name:assertName,pass:Boolean(condition),details});}
  for(const [caseName,count] of Object.entries(visible)){
    check("visible:"+caseName,count>200,{visiblePixelCount:count});
    check("not-disappeared:"+caseName,count>2500,{visiblePixelCount:count});
  }
  for(const [comparisonName,data] of Object.entries(comparisons)){
    check("render-difference:"+comparisonName,data.changedPixels>=20&&data.meanAbsChannelDelta>=0.01,data);
  }
  const validationError=await gpuDevice.popErrorScope();
  check("webgpu-validation",!validationError,{message:validationError?.message||""});

  const failures=assertions.filter(item=>!item.pass);
  const report={visible,comparisons,assertions,failures};
  rootElement.dataset.behaviorReport=JSON.stringify(report);
  stateElement.textContent=JSON.stringify(report,null,2);
  if(failures.length) throw new Error("behavior assertions failed: "+failures.map(item=>item.name).join(", "));
  rootElement.dataset.webgpuStatus="ok"; rootElement.dataset.webgpuStage="done";
}
main().catch(fail);
</script></body></html>
