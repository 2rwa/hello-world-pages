<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061724">
<title>Gravity Glass | WebGPU</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#061724;color:#eafaff}
body{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.overlay{position:absolute;z-index:2;pointer-events:none}
header{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 23px) 22px 16px;
background:linear-gradient(180deg,rgba(2,15,27,.94),rgba(2,15,27,0))}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.3em;color:#8de8e7;text-transform:uppercase}
h1{margin:6px 0 5px;font-size:clamp(27px,5vw,49px);letter-spacing:-.055em;font-weight:750;line-height:1.08}
header p{margin:0;color:#b0cdd6;font-size:12px;line-height:1.6}
.marker{color:#8ee9ce}
#meter{position:absolute;right:20px;top:calc(env(safe-area-inset-top) + 24px);font-size:11px;color:#91b9be;
font-variant-numeric:tabular-nums}
footer{left:0;right:0;bottom:0;padding:10px 15px calc(env(safe-area-inset-bottom) + 15px);
background:linear-gradient(0deg,rgba(2,13,23,.98) 0%,rgba(3,17,29,.88) 75%,transparent 100%);
pointer-events:auto}
/* .overlay has class specificity; restore hit testing only for the controls. */
footer.overlay{pointer-events:auto;touch-action:auto}
footer button,footer input{pointer-events:auto}
.toolbar{max-width:700px;margin:auto;display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
button{min-height:42px;border-radius:12px;border:1px solid rgba(138,218,230,.27);background:#163b4c;
color:#e9ffff;font-size:12px;font-weight:650;padding:9px 12px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
button.primary{background:#84e3c5;color:#08282c;border-color:#94f3d1;font-weight:800}
.panel{max-width:700px;margin:9px auto 0;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.control{display:flex;align-items:center;gap:7px;font-size:11px;color:#a8cbd2}
.control input[type=range]{width:85px;accent-color:#8be8c8}
.control strong{color:#e5fffc;font-size:12px;min-width:16px;text-align:right}
.control.check{user-select:none;cursor:pointer}
input[type=checkbox]{accent-color:#8be8c8;width:15px;height:15px}
.diagnostics{display:flex;justify-content:space-between;gap:6px;max-width:700px;margin:9px auto 0;
font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#92b5bf}
#status{max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tiltReadout{font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{margin:8px 0 0;text-align:center;font-size:10px;color:#789faa}
@media(max-width:550px){
 header{padding-left:16px;padding-top:calc(env(safe-area-inset-top) + 15px)}
 h1{font-size:30px}
 #meter{right:14px;font-size:10px}
 header p{max-width:240px;font-size:11px}
 footer{padding-left:8px;padding-right:8px}
 .toolbar{gap:5px}
 button{padding:7px 9px;min-height:40px;font-size:11px}
 .panel{gap:7px 14px;margin-top:7px}
 .control input[type=range]{width:62px}
 #status{max-width:55%}
 .hint{font-size:9px;margin-top:5px}
}
</style></head><body>
<canvas id="view" aria-label="ガラス玉が重力で転がるWebGPU盤面"></canvas>
<header class="overlay">
<div class="eyebrow">WebGPU · Motion Sensor · Ray Refraction</div>
<h1>GRAVITY <span class="marker">GLASS</span></h1>
<p>スマホを傾けると、ガラス玉が重力に従って転がる。<br>PCでは盤面をドラッグ / 矢印キーで操作。</p>
</header>
<div id="meter" class="overlay">GPU 初期化中…</div>
<footer class="overlay">
<div class="toolbar">
<button id="sensorButton" class="primary">◎ センサーを有効にする</button>
<button id="recenter">基準角度を設定</button>
<button id="reset">玉を戻す</button>
<button id="pause">一時停止</button>
</div>
<div class="panel">
<label class="control">玉の数 <input id="count" type="range" min="1" max="5" step="1" value="3"><strong id="countOut">3</strong></label>
<label class="control">摩擦 <input id="friction" type="range" min="0.3" max="5" step=".1" value="1.8"><strong id="frictionOut">1.8</strong></label>
<label class="control check"><input id="reverse" type="checkbox">傾き反転</label>
</div>
<div class="diagnostics"><span id="status">初期化中…</span><span id="tiltReadout">X 0.0 / Y 0.0 m/s²</span></div>
<p class="hint" id="sensorStatus">センサー非対応でも、画面をドラッグして操作できます。</p>
</footer>
<script type="module" src="./main.js"></script>
</body></html>
